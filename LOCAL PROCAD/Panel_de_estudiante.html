<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vista de Estudiante — PROCAD</title>
<style>
  :root{
    --paper:#F4F5F7; --ink:#101828; --ink-soft:#5B6472; --line:#D9DCE1; --line-soft:#E9EBEE;
    --blue:#00337A; --blue-soft:#E7ECF5; --gold:#FFCD00; --green:#1F9D63; --green-soft:#E7F5EC;
    --red:#D6484A; --red-soft:#FDECEC; --amber:#D98F2B; --amber-soft:#FBF0DE; --purple:#6D4AFF; --purple-soft:#F1EAFB;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{background:var(--paper); color:var(--ink); font-family:'Helvetica Neue', Helvetica, Arial, sans-serif; line-height:1.5; -webkit-font-smoothing:antialiased;}
  .board{max-width:880px; margin:0 auto; padding:40px 28px 60px;}

  .brand-header{display:flex; align-items:center; gap:14px; margin-bottom:18px;}
  .brand-header .shield-icon{width:40px; flex:none;}
  .brand-header .shield-icon img{width:100%; display:block;}
  .brand-header h1{font-size:22px; font-weight:700; margin:0; color:var(--blue); border-left:3px solid var(--gold); padding-left:14px;}

  /* ---- simulador de escenario (herramienta de demo, no es parte del producto) ---- */
  .sim-box{display:flex; align-items:center; gap:10px; margin-bottom:18px; flex-wrap:wrap; background:#fff; border:1px dashed var(--line); border-radius:10px; padding:10px 14px;}
  .sim-label{font-size:11px; color:var(--ink-soft); font-weight:700; text-transform:uppercase; letter-spacing:.04em; flex:none;}
  .sim-box select{font-family:inherit; font-size:12.5px; padding:7px 10px; border:1px solid var(--line); border-radius:8px; background:#fff; color:var(--ink); flex:1; min-width:220px;}

  /* ---- navegación superior ---- */
  .app-nav{display:flex; gap:4px; margin-bottom:0; overflow-x:auto;}
  .app-nav button{font-family:inherit; font-size:12.5px; font-weight:600; padding:11px 16px; border:none; background:transparent; color:var(--ink-soft); cursor:pointer; border-radius:10px 10px 0 0; white-space:nowrap;}
  .app-nav button.active{background:#fff; color:var(--blue);}
  .app-nav button:disabled{color:var(--line); cursor:not-allowed;}

  .frame{border:1px solid var(--line); border-radius:0 14px 14px 14px; background:#fff; overflow:hidden; box-shadow:0 1px 3px rgba(16,24,40,.06);}
  .app-header{display:flex; align-items:baseline; gap:10px; padding:18px 22px; flex-wrap:wrap; background:linear-gradient(180deg, var(--blue) 0%, #002259 100%); position:relative;}
  .app-header::after{content:''; position:absolute; left:0; right:0; bottom:0; height:4px; background:var(--gold);}
  .app-title{font-weight:700; font-size:14px; color:#fff;}
  .app-sub{font-size:11px; color:#AFC0DE;}
  .app-body{padding:24px 26px;}

  .breadcrumb{display:flex; align-items:center; gap:6px; margin-bottom:22px; flex-wrap:wrap;}
  .crumb{font-size:11.5px; color:var(--ink-soft); font-weight:600;}
  .crumb.active{color:var(--blue);}
  .crumb-sep{color:var(--line); font-size:11px;}

  h2.screen-title{font-size:19px; margin:0 0 4px;}
  p.screen-sub{font-size:13px; color:var(--ink-soft); margin:0 0 22px;}

  /* ---- catálogo ---- */
  .catalog-grid{display:grid; grid-template-columns:repeat(auto-fit,minmax(220px,1fr)); gap:14px;}
  .grupo-card{border:1px solid var(--line); border-radius:12px; padding:16px 18px; cursor:pointer; background:#fff;}
  .grupo-card:hover{border-color:var(--blue); box-shadow:0 2px 8px rgba(0,51,122,.08);}
  .tipo-tag{display:inline-block; font-size:9.5px; font-weight:700; text-transform:uppercase; letter-spacing:.04em; padding:3px 9px; border-radius:20px; margin-bottom:10px;}
  .tipo-tag.deportivo{background:var(--green-soft); color:var(--green);}
  .tipo-tag.artistico{background:var(--purple-soft); color:var(--purple);}
  .grupo-card h3{margin:0 0 4px; font-size:14.5px; color:var(--ink);}
  .grupo-card .centro{font-size:11.5px; color:var(--ink-soft);}

  /* ---- detalle ---- */
  .back-btn{font-family:inherit; font-size:12px; color:var(--ink-soft); background:none; border:none; cursor:pointer; margin-bottom:18px; padding:0;}
  .back-btn:hover{color:var(--blue);}
  .detail-head{display:flex; align-items:flex-start; justify-content:space-between; gap:14px; margin-bottom:16px;}
  .detail-head h2{margin:6px 0 4px; font-size:20px; color:var(--ink);}
  .detail-desc{font-size:13.5px; color:var(--ink-soft); line-height:1.6; margin:0 0 24px; max-width:560px;}
  .gate-box{border-radius:12px; padding:16px 18px; font-size:13px;}
  .gate-box.ok{background:var(--green-soft); border:1px solid #BFE6CC; color:#12603C;}
  .gate-box.blocked{background:var(--red-soft); border:1px solid #F3C4C4; color:#8A2727;}
  .gate-box.info{background:var(--blue-soft); border:1px solid #C9D6EE; color:var(--blue);}
  .gate-box.warn{background:var(--amber-soft); border:1px solid #F0D9AE; color:#8A5A16;}
  .primary-btn{font-family:inherit; font-size:13px; font-weight:700; background:var(--blue); color:#fff; border:none; border-radius:9px; padding:12px 20px; cursor:pointer; margin-top:16px;}
  .primary-btn:hover{background:#002259;}
  .primary-btn:disabled{background:var(--line); color:var(--ink-soft); cursor:not-allowed;}
  .primary-btn.sm{padding:8px 14px; font-size:12px; margin-top:0;}

  /* ---- formulario ---- */
  .student-summary{display:flex; align-items:center; gap:12px; background:var(--blue-soft); border-radius:10px; padding:12px 16px; margin-bottom:26px; font-size:12.5px; color:var(--blue); flex-wrap:wrap;}
  .student-summary b{color:var(--blue);}
  .form-section{margin-bottom:26px;}
  .form-section h4{font-size:12px; text-transform:uppercase; letter-spacing:.04em; color:var(--ink-soft); margin:0 0 14px; padding-bottom:8px; border-bottom:1px solid var(--line);}
  .field{margin-bottom:16px;}
  .field label{display:block; font-size:12.5px; font-weight:600; color:var(--ink); margin-bottom:6px;}
  .field label .req{color:var(--red);}
  .field label .opt{color:var(--ink-soft); font-weight:400; font-size:11px;}
  .field input[type=text], .field input[type=email], .field input[type=tel], .field textarea, .field select{
    width:100%; font-family:inherit; font-size:13px; padding:9px 11px; border:1px solid var(--line); border-radius:8px; color:var(--ink); background:#fff;
  }
  .field textarea{resize:vertical; min-height:70px;}
  .field.error input, .field.error textarea, .field.error select{border-color:var(--red);}
  .field .err-msg{display:none; font-size:11px; color:var(--red); margin-top:5px;}
  .field.error .err-msg{display:block;}
  .row2{display:grid; grid-template-columns:1fr 1fr; gap:14px;}
  .file-input{border:1px dashed var(--line); border-radius:8px; padding:12px; font-size:12px; color:var(--ink-soft);}
  .file-input input{margin-bottom:6px;}
  .file-list{margin:6px 0 0; padding-left:16px; font-size:11.5px; color:var(--ink-soft);}
  .check-field{display:flex; align-items:flex-start; gap:9px; font-size:12.5px; color:var(--ink);}
  .check-field input{margin-top:3px; flex:none;}
  .check-field a{color:var(--blue);}

  /* ---- confirmación ---- */
  .confirm-box{text-align:center; padding:30px 10px;}
  .confirm-icon{width:56px; height:56px; border-radius:50%; background:var(--green-soft); color:var(--green); display:flex; align-items:center; justify-content:center; font-size:26px; margin:0 auto 18px;}
  .confirm-box h2{font-size:19px; margin:0 0 8px;}
  .confirm-box p{font-size:13px; color:var(--ink-soft); max-width:420px; margin:0 auto 24px;}
  .confirm-actions{display:flex; gap:10px; justify-content:center; flex-wrap:wrap;}
  .ghost-btn{font-family:inherit; font-size:12.5px; font-weight:600; background:#fff; color:var(--ink-soft); border:1px solid var(--line); border-radius:9px; padding:11px 18px; cursor:pointer;}
  .ghost-btn:hover{border-color:var(--blue); color:var(--blue);}
  .ghost-btn.sm{padding:8px 14px; font-size:12px;}

  .field.oculto{display:none;}
  .section-note{font-size:12px; color:var(--ink-soft); margin:-6px 0 14px;}
  .field .hint{display:block; font-size:11px; color:var(--ink-soft); margin-top:5px;}
  .field .counter{float:right; font-size:11px; font-weight:400; color:var(--ink-soft);}
  .field.error .counter{color:var(--red);}
  .link-btn{font-family:inherit; font-size:inherit; color:var(--blue); background:none; border:none; padding:0; text-decoration:underline; cursor:pointer;}
  .form-summary{display:none; background:var(--red-soft); border:1px solid #F3C4C4; color:#8A2727; border-radius:10px; padding:12px 15px; font-size:12.5px; margin-bottom:20px;}
  .form-summary.show{display:block;}
  .file-error{display:none; font-size:11px; color:var(--red); margin-top:6px;}
  .file-error.show{display:block;}

  /* ---- inicio / tarjetas de estado ---- */
  .status-card{border:1px solid var(--line); border-radius:14px; padding:22px 24px; margin-bottom:18px;}
  .status-card.acc-green{border-left:4px solid var(--green);}
  .status-card.acc-amber{border-left:4px solid var(--amber);}
  .status-card.acc-red{border-left:4px solid var(--red);}
  .status-card.acc-blue{border-left:4px solid var(--blue);}
  .status-eyebrow{font-size:11px; text-transform:uppercase; letter-spacing:.05em; font-weight:700; color:var(--ink-soft); margin-bottom:6px;}
  .status-card h3{margin:0 0 8px; font-size:17px;}
  .status-card p{margin:0 0 4px; font-size:13.5px; color:var(--ink-soft); line-height:1.6;}
  .badge-row{display:flex; gap:8px; flex-wrap:wrap; margin-top:14px;}
  .badge{display:inline-flex; align-items:center; gap:5px; font-size:11.5px; font-weight:600; padding:5px 11px; border-radius:20px;}
  .badge.on{background:var(--green-soft); color:var(--green);}
  .badge.off{background:var(--line-soft); color:var(--ink-soft);}
  .badge.gold{background:#FFF7DA; color:#8A6A00;}
  .empty-note{font-size:13px; color:var(--ink-soft); padding:18px 0;}
  .dash-grid{display:grid; grid-template-columns:1fr 1fr; gap:14px; margin-top:6px;}
  @media (max-width:620px){ .dash-grid{grid-template-columns:1fr;} }
  .mini-card{border:1px solid var(--line); border-radius:12px; padding:16px 18px;}
  .mini-card .mini-label{font-size:11px; text-transform:uppercase; letter-spacing:.04em; color:var(--ink-soft); margin-bottom:6px;}
  .mini-card .mini-value{font-size:20px; font-weight:700; color:var(--blue);}

  /* ---- mi grupo: actividades y asistencia ---- */
  .subtabs{display:flex; gap:6px; margin-bottom:20px; border-bottom:1px solid var(--line); flex-wrap:wrap;}
  .subtabs button{font-family:inherit; font-size:12.5px; font-weight:600; padding:10px 4px; margin-right:18px; border:none; background:none; color:var(--ink-soft); cursor:pointer; border-bottom:2px solid transparent;}
  .subtabs button.active{color:var(--blue); border-bottom-color:var(--blue);}
  table.simple{width:100%; border-collapse:collapse; font-size:13px;}
  table.simple th{text-align:left; font-size:11px; text-transform:uppercase; letter-spacing:.03em; color:var(--ink-soft); padding:0 10px 10px; border-bottom:1px solid var(--line);}
  table.simple td{padding:12px 10px; border-bottom:1px solid var(--line-soft); vertical-align:middle;}
  table.simple tr:last-child td{border-bottom:none;}
  .pill{display:inline-block; font-size:11px; font-weight:700; padding:3px 10px; border-radius:20px;}
  .pill.presente{background:var(--green-soft); color:var(--green);}
  .pill.ausente{background:var(--red-soft); color:#8A2727;}
  .pill.excusado{background:var(--amber-soft); color:#8A5A16;}
  .pill.pendiente{background:var(--blue-soft); color:var(--blue);}
  .pill.validada{background:var(--green-soft); color:var(--green);}

  /* ---- mis datos ---- */
  .confirm-banner{display:flex; align-items:center; justify-content:space-between; gap:14px; background:var(--amber-soft); border:1px solid #F0D9AE; border-radius:12px; padding:14px 18px; margin-bottom:22px; flex-wrap:wrap;}
  .confirm-banner p{margin:0; font-size:13px; color:#8A5A16;}
  .readonly-field{background:var(--line-soft); color:var(--ink-soft);}

  /* ---- documentos ---- */
  .doc-list{display:grid; gap:14px;}
  .doc-card{border:1px solid var(--line); border-radius:12px; padding:18px 20px; display:flex; align-items:center; justify-content:space-between; gap:14px; flex-wrap:wrap;}
  .doc-section-title{font-size:12px; font-weight:700; text-transform:uppercase; letter-spacing:.04em; color:var(--ink-soft); margin:22px 0 10px;}
  .doc-section-title:first-child{margin-top:0;}
  .doc-card h4{margin:0 0 4px; font-size:14px;}
  .doc-card p{margin:0; font-size:12.5px; color:var(--ink-soft);}
  .proximamente-tag{display:inline-block; font-size:10px; font-weight:700; text-transform:uppercase; letter-spacing:.04em; background:var(--line-soft); color:var(--ink-soft); padding:3px 9px; border-radius:20px; margin-left:8px;}

  .doc-page{display:none;}
  .doc-page.show{display:block;}
  .doc-sheet{border:1px solid var(--line); border-radius:12px; padding:36px 40px; background:#fff;}
  .doc-letterhead{display:flex; align-items:center; gap:14px; border-bottom:2px solid var(--blue); padding-bottom:16px; margin-bottom:24px;}
  .doc-letterhead img{width:44px;}
  .doc-letterhead .lh-title{font-size:13px; font-weight:700; color:var(--blue); line-height:1.4;}
  .doc-letterhead .lh-sub{font-size:11px; color:var(--ink-soft);}
  .doc-sheet h2{font-size:16px; text-align:center; text-transform:uppercase; letter-spacing:.03em; margin:0 0 22px;}
  .doc-sheet p{font-size:13px; line-height:1.9; color:var(--ink); text-align:justify;}
  .doc-field-line{display:inline-block; border-bottom:1px solid var(--ink); min-width:160px; padding:0 4px; font-weight:600;}
  .sign-row{display:grid; grid-template-columns:1fr 1fr; gap:40px; margin-top:56px;}
  .sign-line{border-top:1px solid var(--ink); padding-top:8px; font-size:11.5px; color:var(--ink-soft); text-align:center;}
  .doc-actions{display:flex; gap:10px; margin-top:22px; flex-wrap:wrap;}
  @media print{
    body *{visibility:hidden;}
    .doc-sheet, .doc-sheet *{visibility:visible;}
    .doc-sheet{position:absolute; left:0; top:0; width:100%; border:none;}
    .doc-actions{display:none;}
  }
  @media (max-width:560px){ .row2{grid-template-columns:1fr;} .sign-row{grid-template-columns:1fr; gap:40px;} .doc-sheet{padding:24px 18px;} }
</style>
</head>
<body>

<div class="board">
  <header class="brand-header">
    <div class="shield-icon" id="brand-shield"></div>
    <h1>PROCAD — Vista de Estudiante</h1>
  </header>

  <div class="sim-box">
    <span class="sim-label" id="sim-label">Simular escenario:</span>
    <select id="sim-select" aria-labelledby="sim-label"></select>
  </div>

  <nav class="app-nav" id="app-nav"></nav>

  <div class="frame">
    <div class="app-header">
      <span class="app-title">PROCAD</span>
      <span class="app-sub">Arte y Deporte · Período I-2026</span>
    </div>
    <div class="app-body">

      <div class="breadcrumb" id="breadcrumb"></div>

      <div id="screen-inicio"></div>
      <div id="screen-catalogo" style="display:none"></div>
      <div id="screen-detalle" style="display:none"></div>
      <div id="screen-formulario" style="display:none"></div>
      <div id="screen-correccion" style="display:none"></div>
      <div id="screen-confirmacion" style="display:none"></div>
      <div id="screen-migrupo" style="display:none"></div>
      <div id="screen-misdatos" style="display:none"></div>
      <div id="screen-documentos" style="display:none"></div>

    </div>
  </div>
</div>

<script>
  // ---------- seguridad: escapado de HTML ----------
  function esc(v){
    return String(v == null ? '' : v)
      .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
      .replace(/"/g,'&quot;').replace(/'/g,'&#39;');
  }
  function limpiarInvisibles(txt){
    return String(txt == null ? '' : txt).split('').filter(function(ch){
      var c = ch.charCodeAt(0);
      if(c < 32 || c === 127) return false;
      if(c >= 0x200b && c <= 0x200f) return false;
      if(c >= 0x202a && c <= 0x202e) return false;
      if(c >= 0x2066 && c <= 0x2069) return false;
      if(c === 0xfeff) return false;
      return true;
    }).join('');
  }
  function normalizar(txt){ return limpiarInvisibles(txt).replace(/\s+/g, ' ').trim(); }
  function soloDigitos(txt){ return String(txt == null ? '' : txt).replace(/\D/g, ''); }
  function nombreArchivoSeguro(nombre){
    var n = limpiarInvisibles(nombre).split(/[\\/]/).pop().trim();
    if(!n) return 'archivo';
    return n.length > 80 ? n.slice(0, 77) + '\u2026' : n;
  }
  function formatoTamano(bytes){
    if(bytes < 1024) return bytes + ' B';
    if(bytes < 1024 * 1024) return Math.round(bytes / 1024) + ' KB';
    return (bytes / (1024 * 1024)).toFixed(1) + ' MB';
  }

  // ---------- catalogo de formatos ----------
  const RE = {
    cuenta: /^(19|20)\d{9}$/,
    identidad: /^(0[1-9]|1[0-8])\d{2}-(19|20)\d{2}-\d{5}$/,
    telefono: /^[23789]\d{3}-?\d{4}$/,
    correo: /^[^\s@]+@[^\s@]+\.[A-Za-z]{2,}$/,
    correoUnah: /^[A-Za-z0-9]+([._-][A-Za-z0-9]+)*@unah\.(hn|edu\.hn)$/i,
    nombrePersona: /^[A-Za-zÁÉÍÓÚÜÑáéíóúüñ]+(?:[ '\-][A-Za-zÁÉÍÓÚÜÑáéíóúüñ]+)+$/,
    palabras: /^[A-Za-zÁÉÍÓÚÜÑáéíóúüñ]+(?:[ '\-][A-Za-zÁÉÍÓÚÜÑáéíóúüñ]+)*$/,
    archivoPermitido: /\.(pdf|jpe?g|png|mp3|mp4)$/i
  };

  const PARENTESCOS = [
    'Madre', 'Padre', 'Tutor(a) legal', 'Hermano(a)', 'Abuelo(a)',
    'Tío(a)', 'Primo(a)', 'Cónyuge o pareja', 'Hijo(a)', 'Amigo(a)', 'Otro'
  ];
  const PARENTESCO_OTRO = 'Otro';

  const CORREO_DOMINIOS = [
    'unah.hn', 'unah.edu.hn',
    'gmail.com', 'googlemail.com',
    'ymail.com', 'rocketmail.com'
  ];
  const CORREO_DOMINIOS_PATRON = /^(yahoo|hotmail|outlook)(\.[a-z]{2,4}){1,2}$/;
  const CORREO_DOMINIOS_TEXTO = '@unah.hn, @gmail.com, @yahoo, @hotmail o @outlook';

  function dominioDeCorreo(correo){
    const partes = String(correo || '').toLowerCase().split('@');
    return partes.length === 2 ? partes[1] : '';
  }
  function dominioCorreoPermitido(dominio){
    const d = String(dominio || '').toLowerCase();
    return CORREO_DOMINIOS.indexOf(d) !== -1 || CORREO_DOMINIOS_PATRON.test(d);
  }

  const LIMITES = {
    nombre: 100, parentescoOtro: 40, correo: 254, experiencia: 1000, alergia: 255,
    archivosMax: 5, archivoBytes: 5 * 1024 * 1024, archivosBytesTotal: 20 * 1024 * 1024
  };
  const MSG_TEL = 'Debe tener 8 dígitos y empezar en 2, 3, 7, 8 o 9. Ejemplo: 9988-1234.';

  const ESTUDIANTE = {
    nombre:'Isaac Abisahi Carranza Posadas',
    cuenta:'20221003506',
    carrera:'Ingeniería en Sistemas',
    centro:'Ciudad Universitaria',
    correo:'isaac.carranza@unah.hn',
    correoPersonal:'isaac.carranza@gmail.com',
    telefono:'9988-1234'
  };

  const PERIODO_ACTUAL = 'I-2026';

  const AGRUPACIONES = [
    {id:1, nombre:'Fútbol 11', tipo:'deportivo', deporte:'Fútbol 11', centro:'Ciudad Universitaria (CU)', desc:'Selección de fútbol de la UNAH. Participa en torneos interuniversitarios y representa al campus en competencias nacionales.'},
    {id:2, nombre:'Baloncesto', tipo:'deportivo', deporte:'Baloncesto', centro:'Ciudad Universitaria (CU)', desc:'Equipo de baloncesto universitario, con entrenamientos regulares y participación en la liga estudiantil.'},
    {id:3, nombre:'Voleibol', tipo:'deportivo', deporte:'Voleibol', centro:'Ciudad Universitaria (CU)', desc:'Equipo de voleibol femenino y masculino. Abierto a todos los niveles de experiencia.'},
    {id:4, nombre:'Ajedrez', tipo:'deportivo', deporte:'Ajedrez', centro:'Ciudad Universitaria (CU)', desc:'Club de ajedrez competitivo. Participa en torneos interuniversitarios e intercolegiales.'},
    {id:5, nombre:'Banda Marcial Alma Mater', tipo:'artistico', centro:'Ciudad Universitaria (CU)', desc:'Banda de guerra y marcha de la UNAH, presente en actos oficiales, desfiles y ceremonias institucionales.'},
    {id:6, nombre:'Coro de Lenguas Extranjeras', tipo:'artistico', centro:'Ciudad Universitaria (CU)', desc:'Coro universitario que interpreta repertorio en varios idiomas. No requiere experiencia previa formal.'},
    {id:7, nombre:'Marimba Universitaria', tipo:'artistico', centro:'Ciudad Universitaria (CU)', desc:'Ensamble de marimba que participa en eventos culturales del campus y presentaciones oficiales.'},
    {id:8, nombre:'Grupo Teatral Lucem Aspicio', tipo:'artistico', centro:'Ciudad Universitaria (CU)', desc:'Grupo de teatro universitario. Monta obras cada período y participa en festivales culturales.'}
  ];
  // Nota: el catalogo que ve el estudiante ya viene filtrado por su propio
  // campus (Procad.tgrSolicitudesMismoCampus) -- todas las agrupaciones de
  // arriba son de Ciudad Universitaria, igual que ESTUDIANTE.centro.

  const POSICIONES = {
    'Fútbol 11': ['Portero','Defensa','Mediocampista','Delantero'],
    'Baloncesto': ['Base','Escolta','Alero','Ala-Pívot','Pívot'],
    'Voleibol': ['Colocador','Líbero','Central','Receptor','Opuesto']
  };
  const INSTRUMENTOS = ['Guitarra','Piano','Violín','Batería','Flauta','Trompeta','Saxofón','Bajo','Teclado','Voz'];
  const NIVELES = ['Principiante','Intermedio','Avanzado'];

  // ---------- escenarios de simulacion ----------
  // Esta caja no es parte del producto -- es para que quien revise la
  // maqueta vea, sin backend, cada situacion real en la que un estudiante
  // puede encontrarse. En el sistema real, el estado inicial lo determina
  // la base de datos, no una seleccion manual.
  const ESCENARIOS = [
    {id:'sin_solicitud', label:'Sin solicitud activa', solicitud:null},
    {id:'pendiente', label:'Solicitud pendiente de revisión',
      solicitud:{grupo:AGRUPACIONES[4], estado:'PENDIENTE', fecha:'14 ene 2026'}},
    {id:'observada', label:'Solicitud observada (requiere corrección)',
      solicitud:{grupo:AGRUPACIONES[5], estado:'OBSERVADO', fecha:'10 ene 2026',
        motivoObservacion:'El número de contacto de emergencia no parece válido. Verifícalo y vuelve a enviar tu solicitud.'}},
    {id:'condicionado', label:'Inscrito como excepción de talento (condicionado)',
      solicitud:{grupo:AGRUPACIONES[0], estado:'APROBADO', fecha:'12 ene 2026',
        esCondicionado:true, cumpleIndiceMinimo:false, esEquipo:true, selecciones:[]}},
    {id:'aprobada', label:'Aprobada — integrante del grupo',
      solicitud:{grupo:AGRUPACIONES[0], estado:'APROBADO', fecha:'20 ago 2025', esEquipo:false, selecciones:[]}},
    {id:'aprobada_equipo', label:'Aprobada — en el equipo',
      solicitud:{grupo:AGRUPACIONES[0], estado:'APROBADO', fecha:'20 ago 2025', esEquipo:true, selecciones:[]}},
    {id:'aprobada_seleccion', label:'Aprobada — equipo y convocado a selección',
      solicitud:{grupo:AGRUPACIONES[0], estado:'APROBADO', fecha:'20 ago 2025', esEquipo:true, selecciones:['Selección Universitaria de Fútbol 11']}},
    {id:'no_cumple', label:'No cumple requisito del grupo',
      solicitud:{grupo:AGRUPACIONES[2], estado:'NO_CUMPLE_REQUISITO', fecha:'8 ene 2026'}},
    {id:'expulsado', label:'Expulsado(a) de un grupo',
      solicitud:{grupo:AGRUPACIONES[0], estado:'EXPULSADO', fecha:'1 sep 2025', motivoExpulsion:'Inasistencia reiterada'}},
    {id:'excepcional', label:'Matrícula excepcional (sin pertenecer a un grupo)',
      solicitud:null, matriculaExcepcional:{motivo:'Apoyo en la organización del Festival Cultural UNAH 2026', periodo:PERIODO_ACTUAL}}
  ];

  // Actividades de tipo "entrenamiento" generadas por una serie recurrente
  // NUNCA aparecen aqui -- nadie se inscribe a ellas de antemano, el
  // encargado pasa lista directo. Solo actividades puntuales (partido,
  // torneo, concierto...) admiten inscripcion.
  const MIS_ACTIVIDADES = [
    {id:2, titulo:'Partido amistoso vs. UNITEC', fecha:'25 ene 2026', estado:'VALIDADA', inscrito:false},
    {id:3, titulo:'Torneo interuniversitario', fecha:'2 feb 2026', estado:'PENDIENTE_VALIDACION', inscrito:false},
    {id:4, titulo:'Amistoso vs. Central', fecha:'15 ene 2026', estado:'VALIDADA', inscrito:true}
  ];
  const MI_ASISTENCIA = [
    {fecha:'6 ene 2026', actividad:'Entrenamiento', estado:'presente'},
    {fecha:'8 ene 2026', actividad:'Entrenamiento', estado:'ausente'},
    {fecha:'13 ene 2026', actividad:'Entrenamiento', estado:'excusado', justificacion:'Cita médica'},
    {fecha:'15 ene 2026', actividad:'Amistoso vs. Central', estado:'presente'}
  ];

  let indiceHabilitado = true;
  let escenarioActual = ESCENARIOS[0];
  let datosConfirmados = false;
  let screen = 'inicio';
  let selectedGrupo = null;
  let archivosError = '';

  function initials(nombre){ return String(nombre||'').split(' ').filter(Boolean).slice(0,2).map(w=>w[0]).join('').toUpperCase(); }
  function tieneSolicitudActiva(){
    const s = escenarioActual.solicitud;
    return !!s && (s.estado === 'PENDIENTE' || s.estado === 'OBSERVADO' || s.estado === 'APROBADO');
  }
  // Refleja tgrSolicitudesUnaActivaPorPeriodo: EXPULSADO tambien bloquea una
  // nueva solicitud ese periodo -- a diferencia de NO_CUMPLE_REQUISITO, que
  // si libera al estudiante. El catalogo no debe ser accesible de ninguna
  // manera (ni boton, ni pestana de navegacion) si fue expulsado.
  function fueExpulsado(){
    const s = escenarioActual.solicitud;
    return !!s && s.estado === 'EXPULSADO';
  }
  function puedeAccederCatalogo(){ return !tieneSolicitudActiva() && !fueExpulsado(); }
  function esIntegrante(){ return escenarioActual.solicitud && escenarioActual.solicitud.estado === 'APROBADO'; }

  // ---------- navegación superior ----------
  function navItems(){
    const items = [{id:'inicio', label:'Inicio', enabled:true}];
    items.push({id:'catalogo', label:'Catálogo', enabled: puedeAccederCatalogo()});
    items.push({id:'migrupo', label:'Mi grupo', enabled: esIntegrante()});
    items.push({id:'misdatos', label:'Mis datos', enabled:true});
    items.push({id:'documentos', label:'Documentos', enabled:true});
    return items;
  }
  function screenPertenece(id, activo){
    // A que pestaña de nav pertenece cada pantalla, para resaltarla.
    if(['catalogo','detalle','formulario'].indexOf(id) !== -1) return 'catalogo';
    if(id === 'correccion') return 'catalogo';
    if(id === 'confirmacion') return 'inicio';
    return id;
  }
  function renderNav(){
    const activo = screenPertenece(screen);
    document.getElementById('app-nav').innerHTML = navItems().map(function(it){
      return '<button type="button" data-nav="'+it.id+'" class="'+(activo===it.id?'active':'')+'" '
        + (it.enabled ? '' : 'disabled') + '>'+esc(it.label)+'</button>';
    }).join('');
  }

  // ---------- breadcrumb (solo dentro del flujo de inscripcion) ----------
  function renderBreadcrumb(){
    const bc = document.getElementById('breadcrumb');
    const flujo = {catalogo:1, detalle:2, formulario:3, confirmacion:4};
    if(!(screen in flujo)){ bc.innerHTML = ''; return; }
    const steps = [
      {id:'catalogo', label:'1. Catálogo'},
      {id:'detalle', label:'2. Detalle'},
      {id:'formulario', label:'3. Formulario'},
      {id:'confirmacion', label:'4. Confirmación'}
    ];
    bc.innerHTML = steps.map((s,i)=>
      (i>0 ? '<span class="crumb-sep">\u203a</span>' : '') + '<span class="crumb'+(s.id===screen?' active':'')+'">'+esc(s.label)+'</span>'
    ).join('');
  }

  // ================= PANTALLA: INICIO =================
  function accentDe(estado){
    if(estado === 'APROBADO') return 'acc-green';
    if(estado === 'OBSERVADO') return 'acc-amber';
    if(estado === 'NO_CUMPLE_REQUISITO' || estado === 'EXPULSADO') return 'acc-red';
    return 'acc-blue';
  }
  function renderInicio(){
    const s = escenarioActual.solicitud;
    const me = escenarioActual.matriculaExcepcional;
    let html = '';

    // El aviso de actualizar datos solo tiene sentido si el estudiante ya
    // tiene algo activo en PROCAD este periodo (una solicitud, sea cual sea
    // su estado, o una matricula excepcional) -- si todavia no ha hecho
    // nada, no hay nada que "actualizar" todavia.
    if(!datosConfirmados && (s || me)){
      html += '<div class="gate-box warn" style="margin-bottom:20px; display:flex; align-items:center; justify-content:space-between; gap:14px; flex-wrap:wrap;">'
        + '<span>Debes confirmar tus datos de contacto para el período <b>'+esc(PERIODO_ACTUAL)+'</b>. Es obligatorio al inicio de cada período.</span>'
        + '<button type="button" class="primary-btn sm" id="btn-ir-datos" style="margin:0;">Ir a Mis datos</button>'
        + '</div>';
    }

    if(!s && !me){
      html += indiceBannerHTML()
        + '<div class="status-card acc-blue" style="margin-top:16px;">'
          + '<div class="status-eyebrow">Sin solicitud activa</div>'
          + '<h3>Todavía no perteneces a ninguna agrupación este período</h3>'
          + '<p>Explora el catálogo de grupos deportivos y artísticos disponibles en tu campus y envía tu solicitud.</p>'
          + '<button type="button" class="primary-btn" id="btn-ver-catalogo">Ver catálogo de agrupaciones</button>'
        + '</div>';
    } else if(me && !s){
      html += '<div class="status-card acc-green">'
          + '<div class="status-eyebrow">Matrícula excepcional activa</div>'
          + '<h3>Tienes una matrícula excepcional este período</h3>'
          + '<p>Motivo: '+esc(me.motivo)+'</p>'
          + '<p>Período: '+esc(me.periodo)+'</p>'
          + '<p style="margin-top:10px;">Esta elegibilidad no depende de pertenecer a ningún grupo. Si además quieres unirte a una agrupación, puedes hacerlo desde el catálogo.</p>'
          + '<button type="button" class="ghost-btn sm" id="btn-ver-catalogo" style="margin-top:14px;">Ver catálogo de agrupaciones</button>'
        + '</div>';
    } else if(s.estado === 'PENDIENTE'){
      html += '<div class="status-card acc-blue">'
          + '<div class="status-eyebrow">Solicitud pendiente</div>'
          + '<h3>Tu solicitud a '+esc(s.grupo.nombre)+' está en revisión</h3>'
          + '<p>Enviada el '+esc(s.fecha)+'. El encargado del grupo revisará tu información y te notificaremos por correo cuando haya una decisión.</p>'
        + '</div>';
    } else if(s.estado === 'OBSERVADO'){
      html += '<div class="status-card acc-amber">'
          + '<div class="status-eyebrow">Requiere tu corrección</div>'
          + '<h3>Tu solicitud a '+esc(s.grupo.nombre)+' fue observada</h3>'
          + '<p>'+esc(s.motivoObservacion)+'</p>'
          + '<button type="button" class="primary-btn" id="btn-corregir">Corregir y reenviar</button>'
        + '</div>';
    } else if(s.estado === 'APROBADO'){
      html += '<div class="status-card acc-green">'
          + '<div class="status-eyebrow">Integrante activo</div>'
          + '<h3>Eres integrante de '+esc(s.grupo.nombre)+'</h3>'
          + '<p>Desde el '+esc(s.fecha)+'. Puedes ver tus actividades, tu asistencia y tu rol dentro del grupo.</p>'
          + '<div class="badge-row">'
            + '<span class="badge on">Grupo: integrante</span>'
            + '<span class="badge '+(s.esEquipo?'on':'off')+'">'+(s.esEquipo?'✓ En el equipo':'No está en el equipo')+'</span>'
            + (s.esCondicionado ? '<span class="badge gold">Inscrito como excepción de talento (condicionado)</span>' : '')
            + (s.selecciones && s.selecciones.length
                ? s.selecciones.map(function(n){ return '<span class="badge gold">★ Convocado: '+esc(n)+'</span>'; }).join('')
                : '')
          + '</div>'
          + '<button type="button" class="primary-btn" id="btn-ir-migrupo">Ver mi grupo</button>'
        + '</div>';
    } else if(s.estado === 'NO_CUMPLE_REQUISITO'){
      html += '<div class="status-card acc-red">'
          + '<div class="status-eyebrow">No cumple requisito</div>'
          + '<h3>Tu solicitud a '+esc(s.grupo.nombre)+' no fue aprobada</h3>'
          + '<p>El grupo determinó que no cumples sus requisitos de ingreso. Puedes intentarlo con otra agrupación este mismo período.</p>'
          + '<button type="button" class="primary-btn" id="btn-ver-catalogo">Ver catálogo de agrupaciones</button>'
        + '</div>';
    } else if(s.estado === 'EXPULSADO'){
      html += '<div class="status-card acc-red">'
          + '<div class="status-eyebrow">Ya no eres integrante</div>'
          + '<h3>Fuiste separado(a) de '+esc(s.grupo.nombre)+'</h3>'
          + '<p>Motivo: '+esc(s.motivoExpulsion)+'</p>'
        + '</div>';
    }

    document.getElementById('screen-inicio').innerHTML = html;
  }

  // ================= PANTALLA: CATÁLOGO =================
  function indiceBannerHTML(){
    return indiceHabilitado
      ? '<div class="gate-box ok">Tu índice del período es <b>82%</b> — cumples el mínimo requerido (≥ 70%). Puedes enviar solicitudes a cualquier agrupación de tu campus.</div>'
      : '<div class="gate-box blocked">Tu índice del período es <b>65%</b> — no cumples el mínimo requerido (≥ 70%). Puedes ver el listado, pero no podrás enviar una solicitud este período salvo que un entrenador te proponga como caso especial.</div>';
  }
  function renderCatalogo(){
    // Segunda capa de proteccion: si por algun motivo se llega a esta
    // pantalla estando expulsado (no deberia ser posible por la navegacion,
    // que ya lo bloquea), no se muestra ningun grupo -- ni el boton, ni la
    // pestana, ni el listado mismo quedan disponibles.
    if(fueExpulsado()){
      document.getElementById('screen-catalogo').innerHTML =
        '<h2 class="screen-title">Catálogo de agrupaciones</h2>'
        + '<div class="gate-box blocked">No puedes ver ni aplicar a ninguna agrupación este período: fuiste separado(a) de '+esc(escenarioActual.solicitud.grupo.nombre)+'.</div>';
      return;
    }
    let bloqueado = '';
    if(tieneSolicitudActiva()){
      bloqueado = '<div class="gate-box blocked" style="margin-bottom:20px;">Ya tienes una solicitud activa este período. Solo puedes tener una a la vez — si esa solicitud termina en "No cumple requisito", podrás aplicar a otra agrupación.</div>';
    }
    document.getElementById('screen-catalogo').innerHTML =
      '<h2 class="screen-title">Catálogo de agrupaciones</h2>'
      + '<p class="screen-sub">Mostrando agrupaciones de tu campus: '+esc(ESTUDIANTE.centro)+'.</p>'
      + bloqueado
      + indiceBannerHTML()
      + '<div class="catalog-grid" style="margin-top:20px;">' + AGRUPACIONES.map(g=>
        '<div class="grupo-card" data-grupo="'+esc(g.id)+'" role="button" tabindex="0" aria-label="Ver '+esc(g.nombre)+'">'
          + '<span class="tipo-tag '+(g.tipo==='deportivo'?'deportivo':'artistico')+'">'+(g.tipo==='deportivo'?'Deportiva':'Artística')+'</span>'
          + '<h3>'+esc(g.nombre)+'</h3>'
          + '<div class="centro">'+esc(g.centro)+'</div>'
        + '</div>'
      ).join('') + '</div>';
  }

  // ================= PANTALLA: DETALLE =================
  function renderDetalle(){
    const g = selectedGrupo;
    if(!g) return;
    let gate;
    if(tieneSolicitudActiva()){
      gate = '<div class="gate-box blocked">Ya tienes una solicitud activa este período — no puedes enviar otra hasta que se resuelva o termines tu participación actual.</div>'
        + '<button type="button" class="primary-btn" disabled>Inscribirme a '+esc(g.nombre)+'</button>';
    } else if(indiceHabilitado){
      gate = '<div class="gate-box ok">Tu índice del período (82%) cumple el mínimo requerido (≥ 70%). Puedes enviar tu solicitud.</div>'
        + '<button type="button" class="primary-btn" id="btn-inscribirse">Inscribirme a '+esc(g.nombre)+'</button>';
    } else {
      gate = '<div class="gate-box blocked">Tu índice del período (65%) no alcanza el mínimo requerido (≥ 70%). Puedes ver la información de la agrupación, pero no enviar una solicitud este período por tu cuenta — solo si un entrenador te propone como caso especial.</div>'
        + '<button type="button" class="primary-btn" disabled>Inscribirme a '+esc(g.nombre)+'</button>';
    }
    document.getElementById('screen-detalle').innerHTML =
      '<button type="button" class="back-btn" id="btn-back-catalogo">\u2039 Volver al catálogo</button>'
      + '<span class="tipo-tag '+(g.tipo==='deportivo'?'deportivo':'artistico')+'">'+(g.tipo==='deportivo'?'Deportiva':'Artística')+'</span>'
      + '<div class="detail-head"><div><h2>'+esc(g.nombre)+'</h2><div class="centro">'+esc(g.centro)+'</div></div></div>'
      + '<p class="detail-desc">'+esc(g.desc)+'</p>'
      + gate;
  }

  // ================= PANTALLA: FORMULARIO (inscripción y corrección) =================
  function especificosHTML(g){
    if(g.tipo === 'deportivo'){
      const posiciones = POSICIONES[g.deporte];
      const campoPosicion = posiciones
        ? '<div class="field" id="field-posicion">'
          + '<label for="f-posicion">Posición o rol de juego <span class="opt">(opcional)</span></label>'
          + '<select id="f-posicion" name="posicion" aria-describedby="err-posicion"><option value="">Selecciona\u2026</option>'
          + posiciones.map(function(p){ return '<option value="'+esc(p)+'">'+esc(p)+'</option>'; }).join('')
          + '</select><span class="err-msg" id="err-posicion"></span></div>'
        : '';
      return '<div class="form-section"><h4>Datos deportivos</h4>'
        + campoPosicion
        + '<div class="field" id="field-alergia">'
          + '<label for="f-alergia">Alergia o condición médica relevante <span class="opt">(opcional)</span>'
            + '<span class="counter" id="cnt-alergia">0/'+LIMITES.alergia+'</span></label>'
          + '<textarea id="f-alergia" name="alergia" maxlength="'+LIMITES.alergia+'" placeholder="Solo si aplica. Es informativo para el entrenador, no descalifica." aria-describedby="err-alergia"></textarea>'
          + '<span class="err-msg" id="err-alergia"></span></div>'
        + '</div>';
    }
    return '<div class="form-section"><h4>Datos artísticos</h4>'
      + '<div class="field" id="field-instrumento">'
        + '<label for="f-instrumento">Instrumento <span class="opt">(opcional)</span></label>'
        + '<select id="f-instrumento" name="instrumento" aria-describedby="err-instrumento"><option value="">Selecciona\u2026 (si aplica)</option>'
        + INSTRUMENTOS.map(function(i){ return '<option value="'+esc(i)+'">'+esc(i)+'</option>'; }).join('')
        + '</select><span class="err-msg" id="err-instrumento"></span></div>'
      + '<div class="field" id="field-nivel">'
        + '<label for="f-nivel">Nivel de experiencia <span class="opt">(opcional)</span></label>'
        + '<select id="f-nivel" name="nivel" aria-describedby="err-nivel"><option value="">Selecciona\u2026</option>'
        + NIVELES.map(function(n){ return '<option value="'+esc(n)+'">'+esc(n)+'</option>'; }).join('')
        + '</select><span class="err-msg" id="err-nivel"></span></div>'
      + '</div>';
  }

  // ---------- validación ----------
  function valorDe(id){ const el = document.getElementById(id); return el ? el.value : ''; }
  function marcar(fieldId, mensaje){
    const wrap = document.getElementById(fieldId);
    if(!wrap) return;
    const control = wrap.querySelector('input, textarea, select');
    const msg = wrap.querySelector('.err-msg');
    if(mensaje){
      wrap.classList.add('error');
      if(msg) msg.textContent = mensaje;
      if(control) control.setAttribute('aria-invalid', 'true');
    } else {
      wrap.classList.remove('error');
      if(control) control.setAttribute('aria-invalid', 'false');
    }
  }
  function reglas(){
    return [
      {campo:'field-correo', control:'f-correo-personal', validar:function(v){
        const n = normalizar(v);
        if(!n) return '';
        if(n.length > LIMITES.correo) return 'El correo es demasiado largo.';
        if(!RE.correo.test(n)) return 'Escribe un correo válido. Ejemplo: nombre@gmail.com.';
        if(!dominioCorreoPermitido(dominioDeCorreo(n))){
          return 'Solo se aceptan correos ' + CORREO_DOMINIOS_TEXTO + ' (.com, .es, .com.mx…).';
        }
        return '';
      }},
      {campo:'field-tel', control:'f-telefono', validar:function(v){
        const n = normalizar(v);
        if(!n) return 'Ingresa un número de contacto.';
        if(!RE.telefono.test(n)) return MSG_TEL;
        return '';
      }},
      {campo:'field-experiencia', control:'f-experiencia', validar:function(v){
        return normalizar(v).length > LIMITES.experiencia ? 'Demasiado largo.' : '';
      }},
      {campo:'field-alergia', control:'f-alergia', validar:function(v){
        return normalizar(v).length > LIMITES.alergia ? 'Demasiado largo.' : '';
      }},
      {campo:'field-em-nombre', control:'f-em-nombre', validar:function(v){
        const n = normalizar(v);
        if(!n) return 'Este campo es obligatorio.';
        if(n.length > LIMITES.nombre) return 'Demasiado largo.';
        if(!RE.nombrePersona.test(n)) return 'Escribe nombre y apellido.';
        return '';
      }},
      {campo:'field-em-tel', control:'f-em-telefono', validar:function(v){
        const n = normalizar(v);
        if(!n) return 'Este campo es obligatorio.';
        if(!RE.telefono.test(n)) return MSG_TEL;
        return '';
      }},
      {campo:'field-em-parentesco', control:'f-em-parentesco', validar:function(v){
        return v ? '' : 'Indica qué es de ti esta persona.';
      }},
      {campo:'field-em-parentesco-otro', control:'f-em-parentesco-otro', validar:function(v){
        const sel = document.getElementById('f-em-parentesco');
        if(!sel || sel.value !== PARENTESCO_OTRO) return '';
        const n = normalizar(v);
        if(!n) return 'Indica el parentesco.';
        if(!RE.palabras.test(n)) return 'Usa solo letras.';
        return '';
      }}
    ];
  }
  function validarCampo(regla){
    const mensaje = regla.validar(valorDe(regla.control));
    marcar(regla.campo, mensaje);
    return mensaje;
  }
  function validarFormulario(){
    const pendientes = [];
    reglas().forEach(function(r){ if(validarCampo(r)) pendientes.push(r); });
    if(archivosError) pendientes.push({control:'f-archivos'});
    const chk = document.getElementById('f-reglamento');
    const reglamentoOk = !!(chk && chk.checked);
    const errReg = document.getElementById('reglamento-err');
    if(errReg) errReg.style.display = reglamentoOk ? 'none' : 'block';
    if(chk) chk.setAttribute('aria-invalid', reglamentoOk ? 'false' : 'true');
    if(!reglamentoOk) pendientes.push({control:'f-reglamento'});
    const resumen = document.getElementById('form-summary');
    if(resumen){
      if(pendientes.length){
        resumen.textContent = pendientes.length === 1 ? 'Hay 1 campo que requiere corrección.' : 'Hay ' + pendientes.length + ' campos que requieren corrección.';
        resumen.classList.add('show');
      } else {
        resumen.textContent = '';
        resumen.classList.remove('show');
      }
    }
    if(pendientes.length){
      const primero = document.getElementById(pendientes[0].control);
      if(primero){ if(primero.scrollIntoView) primero.scrollIntoView({block:'center', behavior:'smooth'}); primero.focus(); }
      return false;
    }
    return true;
  }

  function manejarArchivos(e){
    const lista = document.getElementById('f-archivos-list');
    const errBox = document.getElementById('f-archivos-err');
    const files = Array.prototype.slice.call(e.target.files);
    const problemas = [];
    let total = 0;
    files.forEach(function(f){
      const visible = nombreArchivoSeguro(f.name);
      if(!RE.archivoPermitido.test(f.name)){ problemas.push('«' + visible + '» no tiene un formato permitido.'); }
      else if(f.size > LIMITES.archivoBytes){ problemas.push('«' + visible + '» supera los 5 MB.'); }
      total += f.size;
    });
    if(files.length > LIMITES.archivosMax){ problemas.push('Máximo ' + LIMITES.archivosMax + ' archivos (seleccionaste ' + files.length + ').'); }
    if(total > LIMITES.archivosBytesTotal){ problemas.push('El total supera los 20 MB (' + formatoTamano(total) + ').'); }
    lista.innerHTML = files.map(function(f){ return '<li>' + esc(nombreArchivoSeguro(f.name)) + ' <span class="opt">(' + esc(formatoTamano(f.size)) + ')</span></li>'; }).join('');
    archivosError = problemas.join(' ');
    errBox.textContent = archivosError;
    errBox.classList.toggle('show', !!archivosError);
  }

  function formatearTelefono(el){
    const d = soloDigitos(el.value).slice(0, 8);
    el.value = d.length > 4 ? d.slice(0, 4) + '-' + d.slice(4) : d;
  }
  function conectarContador(idTexto, idCnt, limite){
    const t = document.getElementById(idTexto);
    const c = document.getElementById(idCnt);
    if(!t || !c) return;
    const actualizar = function(){ c.textContent = t.value.length + '/' + limite; };
    t.addEventListener('input', actualizar);
    actualizar();
  }

  function conectarFormulario(targetId, modoCorreccion){
    const form = document.getElementById('form-solicitud');
    if(!form) return;
    const inputArchivos = document.getElementById('f-archivos');
    if(inputArchivos) inputArchivos.addEventListener('change', manejarArchivos);
    conectarContador('f-experiencia', 'cnt-experiencia', LIMITES.experiencia);
    conectarContador('f-alergia', 'cnt-alergia', LIMITES.alergia);
    ['f-telefono','f-em-telefono'].forEach(function(id){
      const el = document.getElementById(id);
      if(el) el.addEventListener('input', function(){ formatearTelefono(el); });
    });
    reglas().forEach(function(r){
      const el = document.getElementById(r.control);
      if(!el) return;
      el.addEventListener('blur', function(){ validarCampo(r); });
      el.addEventListener('input', function(){
        const wrap = document.getElementById(r.campo);
        if(wrap && wrap.classList.contains('error')) validarCampo(r);
      });
      if(el.tagName === 'SELECT') el.addEventListener('change', function(){ validarCampo(r); });
    });
    const selParentesco = document.getElementById('f-em-parentesco');
    const wrapOtro = document.getElementById('field-em-parentesco-otro');
    const inputOtro = document.getElementById('f-em-parentesco-otro');
    function sincronizarParentescoOtro(){
      if(!selParentesco || !wrapOtro || !inputOtro) return;
      const esOtro = selParentesco.value === PARENTESCO_OTRO;
      wrapOtro.classList.toggle('oculto', !esOtro);
      inputOtro.setAttribute('aria-required', esOtro ? 'true' : 'false');
      if(!esOtro){ inputOtro.value = ''; marcar('field-em-parentesco-otro', ''); }
    }
    if(selParentesco){
      selParentesco.addEventListener('change', function(){ sincronizarParentescoOtro(); if(selParentesco.value === PARENTESCO_OTRO) inputOtro.focus(); });
      sincronizarParentescoOtro();
    }
    const chk = document.getElementById('f-reglamento');
    if(chk) chk.addEventListener('change', function(){
      const err = document.getElementById('reglamento-err');
      if(err) err.style.display = chk.checked ? 'none' : 'block';
      chk.setAttribute('aria-invalid', chk.checked ? 'false' : 'true');
    });
    form.addEventListener('submit', function(e){
      e.preventDefault();
      if(!modoCorreccion && !indiceHabilitado && !(escenarioActual.solicitud && escenarioActual.solicitud.esCondicionado)){
        const resumen = document.getElementById('form-summary');
        if(resumen){ resumen.textContent = 'Tu índice del período no alcanza el mínimo requerido (≥ 70%). No puedes enviar la solicitud este período.'; resumen.classList.add('show'); }
        return;
      }
      if(!validarFormulario()) return;
      const btn = document.getElementById('btn-enviar');
      if(btn){ if(btn.disabled) return; btn.disabled = true; btn.textContent = 'Enviando\u2026'; }
      renderConfirmacion(modoCorreccion);
      showScreen('confirmacion');
    });
  }

    if(!card) return;
    e.preventDefault();
    abrirGrupo(card);
  });
  document.getElementById('screen-detalle').addEventListener('click', function(e){
    if(e.target.closest('#btn-back-catalogo')){ showScreen('catalogo'); return; }
    if(e.target.closest('#btn-inscribirse')){
      if(!indiceHabilitado || tieneSolicitudActiva()) return;
      renderFormulario(false);
      showScreen('formulario');
      return;
    }
  });
  document.getElementById('screen-formulario').addEventListener('click', function(e){
    if(e.target.closest('[data-back-form]')){ renderDetalle(); showScreen('detalle'); return; }
  });
  document.getElementById('screen-correccion').addEventListener('click', function(e){
    if(e.target.closest('[data-back-form]')){ showScreen('inicio'); renderInicio(); return; }
  });
  document.getElementById('screen-confirmacion').addEventListener('click', function(e){
    if(e.target.closest('#btn-listo')){ showScreen('inicio'); renderInicio(); return; }
  });
  document.getElementById('screen-inicio').addEventListener('click', function(e){
    if(e.target.closest('#btn-ver-catalogo')){ renderCatalogo(); showScreen('catalogo'); return; }
    if(e.target.closest('#btn-corregir')){ selectedGrupo = escenarioActual.solicitud.grupo; renderFormulario(true); showScreen('correccion'); return; }
    if(e.target.closest('#btn-ir-migrupo')){ migrupoTab='rol'; renderMiGrupo(); showScreen('migrupo'); return; }
    if(e.target.closest('#btn-ir-datos')){ renderMisDatos(); showScreen('misdatos'); return; }
  });
  document.getElementById('screen-migrupo').addEventListener('click', function(e){
    const t = e.target.closest('[data-migrupotab]');
    if(t){ migrupoTab = t.dataset.migrupotab; renderMiGrupo(); return; }
    const insc = e.target.closest('[data-inscribir-act]');
    if(insc){
      const a = MIS_ACTIVIDADES.find(x=>x.id === Number(insc.dataset.inscribirAct));
      if(a){ a.inscrito = true; renderMiGrupo(); }
      return;
    }
  });
  document.getElementById('screen-misdatos').addEventListener('click', function(e){
    if(e.target.closest('#btn-confirmar-datos')){ datosConfirmados = true; renderMisDatos(); return; }
    if(e.target.closest('#btn-guardar-datos')){
      ESTUDIANTE.correoPersonal = document.getElementById('md-correo').value;
      ESTUDIANTE.telefono = document.getElementById('md-tel').value;
      renderMisDatos();
      return;
    }
  });
  document.getElementById('screen-documentos').addEventListener('click', function(e){
    const d = e.target.closest('[data-doc]');
    if(d){ docActivo = d.dataset.doc; renderDocumentos(); return; }
    if(e.target.closest('#btn-back-documentos')){ docActivo = null; renderDocumentos(); return; }
    if(e.target.closest('#btn-imprimir-doc')){ window.print(); return; }
  });

  document.getElementById('app-nav').addEventListener('click', function(e){
    const btn = e.target.closest('[data-nav]');
    if(!btn || btn.disabled) return;
    const id = btn.dataset.nav;
    docActivo = null;
    if(id === 'inicio'){ renderInicio(); showScreen('inicio'); }
    else if(id === 'catalogo'){ renderCatalogo(); showScreen('catalogo'); }
    else if(id === 'migrupo'){ migrupoTab='rol'; renderMiGrupo(); showScreen('migrupo'); }
    else if(id === 'misdatos'){ renderMisDatos(); showScreen('misdatos'); }
    else if(id === 'documentos'){ renderDocumentos(); showScreen('documentos'); }
  });

  // ---------- simulador ----------
  const simSelect = document.getElementById('sim-select');
  simSelect.innerHTML = ESCENARIOS.map(function(es){ return '<option value="'+esc(es.id)+'">'+esc(es.label)+'</option>'; }).join('');
  simSelect.addEventListener('change', function(){
    escenarioActual = ESCENARIOS.find(e=>e.id === simSelect.value) || ESCENARIOS[0];
    indiceHabilitado = !(escenarioActual.solicitud && escenarioActual.solicitud.cumpleIndiceMinimo === false && !escenarioActual.solicitud.esCondicionado);
    docActivo = null;
    renderInicio();
    showScreen('inicio');
  });

  renderInicio();
