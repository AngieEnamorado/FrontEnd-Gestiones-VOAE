<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Panel de Director / Entrenador — PROCAD</title>
<style>
  :root{
    --paper:#F4F5F7; --ink:#101828; --ink-soft:#5B6472; --line:#D9DCE1; --line-soft:#E9EBEE;
    --blue:#00337A; --blue-soft:#E7ECF5; --gold:#FFCD00; --green:#1F9D63; --green-soft:#E7F5EC;
    --red:#D6484A; --red-soft:#FDECEC; --amber:#D98F2B; --amber-soft:#FBF0DE; --purple:#6D4AFF; --purple-soft:#F1EAFB;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{background:var(--paper); color:var(--ink); font-family:'Helvetica Neue', Helvetica, Arial, sans-serif; line-height:1.5; -webkit-font-smoothing:antialiased;}
  .board{max-width:1320px; margin:0 auto; padding:36px 24px 60px;}

  .brand-header{display:flex; align-items:center; gap:14px; margin-bottom:16px;}
  .brand-header .shield-icon{width:40px; flex:none;}
  .brand-header .shield-icon img{width:100%; display:block;}
  .brand-header h1{font-size:22px; font-weight:700; margin:0; color:var(--blue); border-left:3px solid var(--gold); padding-left:14px;}

  .sim-box{display:flex; align-items:center; gap:10px; margin-bottom:16px; flex-wrap:wrap; background:#fff; border:1px dashed var(--line); border-radius:10px; padding:10px 14px;}
  .sim-label{font-size:11px; color:var(--ink-soft); font-weight:700; text-transform:uppercase; letter-spacing:.04em; flex:none;}
  .sim-box select{font-family:inherit; font-size:12.5px; padding:7px 10px; border:1px solid var(--line); border-radius:8px; background:#fff; color:var(--ink); flex:1; min-width:200px;}

  .grupo-bar{display:flex; align-items:center; gap:12px; flex-wrap:wrap; margin-bottom:16px;}
  .grupo-bar label{font-size:11px; font-weight:700; text-transform:uppercase; letter-spacing:.04em; color:var(--ink-soft);}
  .grupo-bar select{font-family:inherit; font-size:14px; font-weight:700; padding:9px 12px; border:1px solid var(--line); border-radius:9px; background:#fff; color:var(--blue); min-width:260px;}
  .badge-tag{display:inline-flex; align-items:center; font-size:10.5px; font-weight:700; text-transform:uppercase; letter-spacing:.04em; padding:4px 10px; border-radius:20px;}
  .badge-tag.deportivo{background:var(--green-soft); color:var(--green);}
  .badge-tag.artistico{background:var(--purple-soft); color:var(--purple);}
  .badge-tag.seleccion{background:#FFF7DA; color:#8A6A00;}
  .badge-tag.interno{background:var(--blue-soft); color:var(--blue);}

  .app-nav{display:flex; gap:4px; overflow-x:auto;}
  .app-nav button{font-family:inherit; font-size:12.5px; font-weight:600; padding:11px 15px; border:none; background:transparent; color:var(--ink-soft); cursor:pointer; border-radius:10px 10px 0 0; white-space:nowrap;}
  .app-nav button.active{background:#fff; color:var(--blue);}
  .app-nav button:disabled{color:var(--line); cursor:not-allowed;}

  .frame{border:1px solid var(--line); border-radius:0 14px 14px 14px; background:#fff; overflow:hidden; box-shadow:0 1px 3px rgba(16,24,40,.06);}
  .app-header{display:flex; align-items:baseline; gap:10px; padding:16px 22px; flex-wrap:wrap; background:linear-gradient(180deg, var(--blue) 0%, #002259 100%); position:relative;}
  .app-header::after{content:''; position:absolute; left:0; right:0; bottom:0; height:4px; background:var(--gold);}
  .app-title{font-weight:700; font-size:14px; color:#fff;}
  .app-sub{font-size:11px; color:#AFC0DE;}
  .app-body{padding:22px 24px;}

  h2.screen-title{font-size:18px; margin:0 0 4px;}
  p.screen-sub{font-size:13px; color:var(--ink-soft); margin:0 0 20px;}
  .toolbar{display:flex; align-items:center; gap:10px; flex-wrap:wrap; margin-bottom:16px;}
  .toolbar select, .toolbar input[type=search]{font-family:inherit; font-size:12.5px; padding:8px 10px; border:1px solid var(--line); border-radius:8px;}
  .spacer{flex:1;}

  .primary-btn{font-family:inherit; font-size:12.5px; font-weight:700; background:var(--blue); color:#fff; border:none; border-radius:9px; padding:10px 16px; cursor:pointer;}
  .primary-btn:hover{background:#002259;}
  .primary-btn:disabled{background:var(--line); color:var(--ink-soft); cursor:not-allowed;}
  .ghost-btn{font-family:inherit; font-size:12px; font-weight:600; background:#fff; color:var(--ink-soft); border:1px solid var(--line); border-radius:9px; padding:9px 14px; cursor:pointer;}
  .ghost-btn:hover{border-color:var(--blue); color:var(--blue);}
  .ghost-btn.danger:hover{border-color:var(--red); color:var(--red);}
  .link-btn{font-family:inherit; font-size:inherit; color:var(--blue); background:none; border:none; padding:0; text-decoration:underline; cursor:pointer;}

  .toggle-pill{display:inline-flex; border:1px solid var(--line); border-radius:20px; overflow:hidden; flex:none;}
  .toggle-pill button{font-family:inherit; font-size:11.5px; font-weight:600; padding:8px 14px; border:none; background:#fff; color:var(--ink-soft); cursor:pointer;}
  .toggle-pill button.active{background:var(--blue); color:#fff;}

  /* ---- carrusel del modo Especifico: la ficha en foco al centro y a
     color; la anterior y la siguiente asoman apagadas a los lados y son
     clicables para traerlas al centro (mismo patron que el resto del
     sistema). ---- */
  .carrusel{display:flex; align-items:center; justify-content:center; gap:16px; width:100%;}
  .carrusel-slot{transition:filter .28s ease, opacity .28s ease, transform .28s ease;}
  .carrusel-slot.activa{flex:0 0 380px; max-width:100%;}
  .carrusel-slot.lado{
    flex:0 1 260px; min-width:0; padding:0; margin:0; border:none; background:none;
    font:inherit; text-align:left; cursor:pointer;
    filter:grayscale(.5); opacity:.72; transform:scale(.91);
  }
  .carrusel-slot.lado > *{pointer-events:none;}
  .carrusel-slot.lado:hover, .carrusel-slot.lado:focus-visible{opacity:.88; filter:grayscale(.22); transform:scale(.93);}
  .carrusel-slot.lado:focus-visible{outline:2px solid var(--blue); outline-offset:4px; border-radius:14px;}
  @keyframes ficha-entra-next{
    from{filter:grayscale(.5); opacity:.72; transform:translateX(46px) scale(.92);}
    to{filter:none; opacity:1; transform:none;}
  }
  @keyframes ficha-entra-prev{
    from{filter:grayscale(.5); opacity:.72; transform:translateX(-46px) scale(.92);}
    to{filter:none; opacity:1; transform:none;}
  }
  .carrusel-slot.activa.entra-next{animation:ficha-entra-next .34s ease-out;}
  .carrusel-slot.activa.entra-prev{animation:ficha-entra-prev .34s ease-out;}
  @media (prefers-reduced-motion:reduce){
    .carrusel-slot.activa.entra-next, .carrusel-slot.activa.entra-prev{animation:none;}
  }
  @media (max-width:900px){ .carrusel-slot.lado{display:none;} }
  .nav-btn{
    display:flex; align-items:center; justify-content:center;
    width:44px; height:44px; border-radius:50%; margin-top:110px;
    border:2px solid var(--blue); background:#fff; color:var(--blue);
    font-size:22px; line-height:1; padding:0 0 2px; cursor:pointer; flex:none;
    box-shadow:0 2px 6px rgba(16,24,40,.10);
    transition:background .18s ease, color .18s ease, transform .18s ease;
  }
  .nav-btn:hover{background:var(--blue); color:#fff; transform:scale(1.08);}
  .nav-btn:active{transform:scale(.96);}

  table.tbl{width:100%; border-collapse:collapse; font-size:13px;}
  .tbl-wrap{overflow-x:auto; border:1px solid var(--line); border-radius:10px;}
  .tbl th{text-align:left; font-size:10px; letter-spacing:.05em; text-transform:uppercase; color:var(--ink-soft); padding:9px 12px; border-bottom:1px solid var(--line); background:#fcfcfb; white-space:nowrap;}
  .tbl td{padding:10px 12px; border-bottom:1px solid var(--line-soft); vertical-align:middle;}
  .tbl tr:last-child td{border-bottom:none;}
  .tbl tr[data-row]{cursor:pointer;}
  .tbl tr[data-row]:hover{background:var(--blue-soft);}

  .pill{display:inline-block; font-size:10.5px; font-weight:700; padding:3px 10px; border-radius:20px; white-space:nowrap;}
  .pill.pendiente{background:var(--blue-soft); color:var(--blue);}
  .pill.observado{background:var(--amber-soft); color:#8A5A16;}
  .pill.aprobado{background:var(--green-soft); color:var(--green);}
  .pill.no_cumple{background:var(--red-soft); color:#8A2727;}
  .pill.expulsado{background:var(--red-soft); color:#8A2727;}
  .pill.condicionado_prop{background:#FFF7DA; color:#8A6A00;}
  .pill.validada{background:var(--green-soft); color:var(--green);}
  .pill.pendiente_val{background:var(--blue-soft); color:var(--blue);}
  .pill.rechazada{background:var(--red-soft); color:#8A2727;}

  .empty-note{font-size:13px; color:var(--ink-soft); padding:22px 0; text-align:center;}
  /* ---- botones de accion: discretos, en outline, sin relleno solido --
     el color solo se nota al pasar el mouse. Ninguno actua de inmediato:
     todos abren una confirmacion pequena antes de tocar el estado. ---- */
  .row-actions{display:flex; gap:6px; flex-wrap:wrap;}
  .actions{display:flex; gap:10px; flex-wrap:wrap; margin-top:18px;}
  .btn-accion{font-family:inherit; font-size:11px; padding:8px 12px; border:1px solid var(--line); border-radius:7px; background:#fff; cursor:pointer; white-space:nowrap;}
  .btn-accion.approve{color:var(--green); border-color:var(--green);}
  .btn-accion.approve:hover{background:var(--green-soft);}
  .btn-accion.reject{color:var(--red); border-color:var(--red);}
  .btn-accion.reject:hover{background:var(--red-soft);}
  .btn-accion.observe{color:var(--amber); border-color:var(--amber);}
  .btn-accion.observe:hover{background:var(--amber-soft);}
  .btn-accion.neutral{color:var(--ink-soft); border-color:var(--line);}
  .btn-accion.neutral:hover{border-color:var(--ink); color:var(--ink);}
  .dialog-actions-row{display:flex; gap:10px; justify-content:flex-end; margin-top:16px;}

  /* ---- botones de icono para la tabla General: copiados literales del
     archivo de referencia -- cuadros pequenos, sin texto. ---- */
  .mini-act{
    width:25px; height:25px; border-radius:6px; border:1px solid var(--line); background:#fff;
    cursor:pointer; font-size:12px; padding:0; margin-right:4px; line-height:1;
  }
  .mini-act.approve{color:var(--green); border-color:var(--green);}
  .mini-act.approve:hover{background:var(--green-soft);}
  .mini-act.reject{color:var(--red); border-color:var(--red);}
  .mini-act.reject:hover{background:var(--red-soft);}
  .mini-act.observe{color:var(--amber); border-color:var(--amber);}
  .mini-act.observe:hover{background:var(--amber-soft);}
  .mini-act.neutral{color:var(--ink-soft);}
  .mini-act.neutral:hover{border-color:var(--ink); color:var(--ink);}
  .peek-btn{border:1px solid var(--line); background:#fff; border-radius:6px; padding:3px 8px; cursor:pointer; font-size:12px;}
  .peek-btn:hover{border-color:var(--blue);}
  .th-inner{display:inline-flex; align-items:center; gap:4px;}
  .pin-btn{background:none; border:none; cursor:pointer; font-size:11px; padding:2px 4px; border-radius:4px; color:#c7ccd3; flex:none;}
  .pin-btn:hover{background:var(--blue-soft); color:var(--blue);}
  .pin-btn.pinned{color:var(--blue);}
  .tbl th.pinned, .tbl td.pinned{background:#fff; z-index:3;}
  .tbl th.pinned{background:#fcfcfb; z-index:4;}
  .tbl td.pin-edge, .tbl th.pin-edge{box-shadow:2px 0 6px -2px rgba(26,33,48,.25);}
  .status-dot{display:inline-flex; align-items:center; gap:6px; font-size:10.5px; color:var(--ink-soft); flex:none;}
  .status-dot i{width:7px; height:7px; border-radius:50%; background:var(--c); display:inline-block; flex:none;}

  /* ---- overlay / dialogo accesible ---- */
  .overlay{position:fixed; inset:0; background:rgba(16,24,40,.5); display:flex; align-items:center; justify-content:center; padding:20px; z-index:50;}
  .overlay[hidden]{display:none;}
  .dialog{background:#fff; border-radius:14px; max-width:480px; width:100%; padding:24px 26px; max-height:88vh; overflow-y:auto;}
  .dialog h3{margin:0 0 6px; font-size:16px;}
  .dialog p.dsub{margin:0 0 18px; font-size:12.5px; color:var(--ink-soft);}
  .dialog .field{margin-bottom:14px;}
  .dialog label{display:block; font-size:12.5px; font-weight:600; margin-bottom:6px;}
  .dialog select, .dialog textarea, .dialog input[type=text], .dialog input[type=number], .dialog input[type=date], .dialog input[type=time]{
    width:100%; font-family:inherit; font-size:13px; padding:9px 11px; border:1px solid var(--line); border-radius:8px;
  }
  .dialog textarea{min-height:80px; resize:vertical;}
  .dialog-actions{display:flex; gap:10px; justify-content:flex-end; margin-top:20px;}
  .dialog .err-msg{font-size:11px; color:var(--red); margin-top:5px; display:none;}
  .dialog .field.error .err-msg{display:block;}
  .dialog .field.error select, .dialog .field.error textarea, .dialog .field.error input{border-color:var(--red);}

  /* ---- ficha de solicitud ---- */
  /* Ya no se divide en dos columnas (credencial + detalles aparte) -- es
     una sola tarjeta que fluye de arriba a abajo, copiado literal del
     archivo de referencia. */
  .ficha{border:1px solid var(--line); border-radius:14px; overflow:hidden; background:#fff;}
  .carrusel-slot.activa .ficha{box-shadow:0 6px 20px rgba(16,24,40,.10);}
  /* Copiado literal del archivo de referencia: fondo dorado con rayas
     diagonales, no azul marino. */
  .ficha-forma{
    padding:24px 22px; position:relative; overflow:hidden;
    background-image:
      repeating-linear-gradient(115deg, rgba(255,255,255,.16) 0 12px, transparent 12px 30px),
      linear-gradient(135deg, #FFC531 0%, #FF9E1F 55%, #FF8A00 100%);
  }
  .ficha-forma .fh-row{display:flex; align-items:center; gap:12px; margin-bottom:22px; position:relative; z-index:1;}
  .ficha-forma img{width:44px; display:block; position:relative; z-index:1;}
  .ficha-forma .fh-title{font-weight:700; font-size:20px; color:#123A8F; letter-spacing:.02em; line-height:1; border-left:2px solid rgba(28,20,0,.35); padding-left:12px;}
  .ficha-forma .fh-sub{font-size:8.5px; color:#5b4400; letter-spacing:.02em; max-width:165px; line-height:1.3; margin-top:4px; border-left:2px solid rgba(28,20,0,.35); padding-left:12px;}
  .ficha-forma .fh-avatar{
    margin-left:auto; width:44px; height:44px; border-radius:9px; background:var(--blue); color:#fff;
    display:flex; align-items:center; justify-content:center; font-weight:700; font-size:15px;
    box-shadow:0 4px 10px rgba(0,0,0,.2); position:absolute; top:24px; right:22px; z-index:1;
  }
  .ficha-forma .fh-field{margin-bottom:18px; position:relative; z-index:1;}
  .ficha-forma .fh-field:last-child{margin-bottom:0;}
  .ficha-forma .fh-field span{display:block; font-size:9.5px; letter-spacing:.06em; text-transform:uppercase; color:#5b4400; margin-bottom:4px; font-weight:700;}
  .ficha-forma .fh-field b{display:block; font-size:18px; font-weight:800; color:#151515;}
  .ficha-forma .fh-field.cuenta b{font-size:23px;}
  .ficha-body{padding:18px 22px 22px;}
  .ficha-meta-row{display:flex; align-items:flex-start; justify-content:space-between; gap:10px; margin-bottom:16px;}
  .ficha-toprow{display:grid; grid-template-columns:repeat(auto-fit, minmax(120px,1fr)); gap:10px 16px; margin:0 0 16px;}
  .ficha-grid{display:grid; grid-template-columns:1fr 1fr; gap:10px 16px; margin:0;}
  .kv{display:flex; flex-direction:column; gap:3px;}
  .kv span{font-size:9.5px; color:var(--ink-soft); text-transform:uppercase; letter-spacing:.04em;}
  .kv b{font-size:13px; font-weight:600;}
  .exp-field{margin:0 0 16px;}
  .exp-label{display:block; font-size:9.5px; color:var(--ink-soft); text-transform:uppercase; letter-spacing:.04em; margin-bottom:6px; font-weight:700;}
  .exp-box{border:1px solid var(--line); border-radius:9px; padding:12px 14px; background:#fcfcfb;}
  .exp-text{margin:0 0 9px; font-size:13px; line-height:1.5; color:var(--ink);}
  .exp-text.empty{color:var(--ink-soft); font-style:italic;}
  .exp-files{display:flex; flex-wrap:wrap; gap:6px;}
  .file-chip{font-size:10.5px; color:var(--ink); background:#fff; border:1px solid var(--line); border-radius:6px; padding:4px 9px; white-space:nowrap;}
  .file-chip.empty{color:var(--ink-soft); border-style:dashed;}
  @media (max-width:520px){ .ficha-grid{grid-template-columns:1fr;} }

  /* ---- integrantes ---- */
  .toggle-sw{display:inline-flex; align-items:center; gap:6px; cursor:pointer; font-size:12px;}
  .toggle-sw input{width:16px; height:16px;}

  /* ---- actividades / serie ---- */
  .dias-selector{display:flex; gap:6px; flex-wrap:wrap;}
  .dia-chip{font-family:inherit; font-size:12px; font-weight:600; border:1px solid var(--line); background:#fff; border-radius:8px; padding:8px 12px; cursor:pointer;}
  .dia-chip.on{background:var(--blue); color:#fff; border-color:var(--blue);}

  /* ---- pasar lista: cuadricula semanal ---- */
  .asistencia-grid{width:100%; border-collapse:collapse; font-size:12.5px;}
  .asistencia-grid th{font-size:10px; text-transform:uppercase; color:var(--ink-soft); padding:8px 6px; border-bottom:1px solid var(--line); text-align:center;}
  .asistencia-grid th:first-child{text-align:left;}
  .asistencia-grid td{padding:8px 6px; border-bottom:1px solid var(--line-soft); text-align:center;}
  .asistencia-grid td:first-child{text-align:left; font-weight:600;}
  .celda-asistencia{width:34px; height:34px; border-radius:8px; border:1px solid var(--line); background:#fff; cursor:pointer; font-size:14px; font-weight:700;}
  .celda-asistencia.presente{background:var(--green-soft); color:var(--green); border-color:var(--green);}
  .celda-asistencia.ausente{background:var(--red-soft); color:#8A2727; border-color:var(--red);}
  .celda-asistencia.excusado{background:var(--amber-soft); color:#8A5A16; border-color:var(--amber);}
  .celda-asistencia:disabled{cursor:not-allowed; opacity:.55;}

  /* ---- config ---- */
  .config-card{border:1px solid var(--line); border-radius:12px; padding:18px 20px; margin-bottom:16px;}
  .config-card h4{margin:0 0 4px; font-size:13.5px;}
  .config-card p{margin:0 0 12px; font-size:12px; color:var(--ink-soft);}
  .config-card input[type=number]{width:90px; font-family:inherit; font-size:14px; font-weight:700; padding:8px 10px; border:1px solid var(--line); border-radius:8px; color:var(--blue);}
  .checkbox-grid{display:grid; grid-template-columns:repeat(auto-fit,minmax(160px,1fr)); gap:8px;}
  .checkbox-row{display:flex; align-items:center; gap:8px; font-size:12.5px;}

  /* ---- elegibilidad ---- */
  .bar-track{width:100%; height:8px; background:var(--line-soft); border-radius:20px; overflow:hidden;}
  .bar-fill{height:100%; border-radius:20px;}
  .bar-fill.ok{background:var(--green);}
  .bar-fill.no{background:var(--red);}

  .toast{position:fixed; bottom:24px; left:50%; transform:translateX(-50%); background:var(--ink); color:#fff; padding:12px 20px; border-radius:9px; font-size:13px; z-index:80; opacity:0; transition:opacity .2s;}
  .toast.show{opacity:1;}
</style>
</head>
<body>

<div class="board">
  <header class="brand-header">
    <div class="shield-icon" id="brand-shield"></div>
    <h1>PROCAD — Panel de Director / Entrenador</h1>
  </header>

  <div class="sim-box">
    <span class="sim-label">Colaborador simulado:</span>
    <span class="badge-tag interno">Colaborador interno</span>
    <span style="font-size:11.5px; color:var(--ink-soft);">Un colaborador externo nunca ve este panel — el administrador actúa en el sistema por él.</span>
  </div>

  <div class="grupo-bar">
    <label for="grupo-select">Grupo actual</label>
    <select id="grupo-select"></select>
    <span id="grupo-badges"></span>
  </div>

  <nav class="app-nav" id="app-nav"></nav>

  <div class="frame">
    <div class="app-header">
      <span class="app-title">PROCAD</span>
      <span class="app-sub" id="app-sub-label">Arte y Deporte · Período I-2026</span>
    </div>
    <div class="app-body" id="app-body">
      <div id="screen-solicitudes"></div>
      <div id="screen-ficha" style="display:none"></div>
      <div id="screen-integrantes" style="display:none"></div>
      <div id="screen-actividades" style="display:none"></div>
      <div id="screen-asistencia" style="display:none"></div>
      <div id="screen-config" style="display:none"></div>
      <div id="screen-elegibilidad" style="display:none"></div>
      <div id="screen-seleccion" style="display:none"></div>
    </div>
  </div>
</div>

<div class="overlay" id="dialog-overlay" hidden>
  <div class="dialog" id="dialog-content" role="dialog" aria-modal="true"></div>
</div>
<div class="toast" id="toast"></div>

<script>
  // ---------- seguridad ----------
  function esc(v){
    return String(v == null ? '' : v)
      .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
      .replace(/"/g,'&quot;').replace(/'/g,'&#39;');
  }
  function nombreArchivoSeguro(nombre){
    let n = String(nombre == null ? '' : nombre).split(/[\\/]/).pop();
    n = n.split('').filter(function(ch){
      var c = ch.charCodeAt(0);
      if(c < 32 || c === 127) return false;
      if(c >= 0x200b && c <= 0x200f) return false;
      if(c >= 0x202a && c <= 0x202e) return false;
      if(c >= 0x2066 && c <= 0x2069) return false;
      if(c === 0xfeff) return false;
      return true;
    }).join('').trim();
    if(!n) return 'archivo';
    return n.length > 80 ? n.slice(0, 77) + '\u2026' : n;
  }

  function applyColumnPinning(){
    const theadRow = document.querySelector('#tabla-general thead tr');
    if(!theadRow) return;
    let offset = 0;
    let lastPinnedKey = null;
    columnasGeneral().forEach(function(c){
      const th = theadRow.querySelector('[data-col="'+c.key+'"]');
      const tds = document.querySelectorAll('#tabla-general tbody [data-col="'+c.key+'"]');
      if(pinnedCols.has(c.key)){
        const width = th ? th.offsetWidth : 0;
        if(th){ th.style.position='sticky'; th.style.left=offset+'px'; th.classList.add('pinned'); th.classList.remove('pin-edge'); }
        tds.forEach(function(td){ td.style.position='sticky'; td.style.left=offset+'px'; td.classList.add('pinned'); td.classList.remove('pin-edge'); });
        offset += width;
        lastPinnedKey = c.key;

  function accionSolicitud(accion, id){

      abrirDialogo(

        toast('Solicitud de '+s.nombre+' marcada como no cumple requisito.');
        refrescarPantallaActual();
      });
    } else if(accion === 'observar'){
      abrirDialogo(

        + '<div class="field" id="f-obs-wrap"><label for="f-obs">Motivo de la observación</label><textarea id="f-obs" placeholder="Ej. El número de contacto de emergencia no parece válido."></textarea><span class="err-msg">Escribe el motivo.</span></div>'

      );

        cerrarDialogo();
        toast('Solicitud de '+s.nombre+' observada.');
        refrescarPantallaActual();
      });
    } else if(accion === 'condicionar'){
      abrirDialogo(
        '<h3>Proponer como condicionado</h3><p class="dsub">'+esc(s.nombre)+' no alcanza el índice mínimo. Esta propuesta queda pendiente de que un administrador la autorice — usted no puede aprobarla usted mismo(a).</p>'
        + '<div class="field" id="f-cond-wrap"><label for="f-cond">¿Por qué propone esta excepción?</label><textarea id="f-cond" placeholder="Ej. Talento sobresaliente, titular en su posición desde el período anterior."></textarea><span class="err-msg">Escribe una justificación.</span></div>'

      );

  // ================= PASAR LISTA =================
  let modoAsistencia = 'serie';
  // Convierte cada dia abreviado a su numero ISO (Lun=1 ... Dom=7), para
  // ubicarlo dentro de la semana actual real -- no depende de @@DATEFIRST
  // ni nada por el estilo, es puro calculo de fechas en el navegador.
  const ORDEN_DIAS_ISO = {'Lun':1, 'Mar':2, 'Mié':3, 'Jue':4, 'Vie':5, 'Sáb':6, 'Dom':7};
  const MESES_ES = ['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
  function lunesDeEstaSemana(){
    const hoy = new Date();
    const diaISO = hoy.getDay() === 0 ? 7 : hoy.getDay();
    const lunes = new Date(hoy.getFullYear(), hoy.getMonth(), hoy.getDate() - (diaISO - 1));
    lunes.setHours(0,0,0,0);
    return lunes;
  }
  function fechaDeDiaEstaSemana(diaAbrev){
    const lunes = lunesDeEstaSemana();
    const offset = (ORDEN_DIAS_ISO[diaAbrev] || 1) - 1;
    return new Date(lunes.getFullYear(), lunes.getMonth(), lunes.getDate() + offset);
  }
  function esDiaYaPasado(fecha){
    const hoy = new Date();
    hoy.setHours(0,0,0,0);
    return fecha.getTime() < hoy.getTime();
  }
  function tituloSemanaHTML(){
    const lunes = lunesDeEstaSemana();
    const domingo = new Date(lunes.getFullYear(), lunes.getMonth(), lunes.getDate()+6);
    const mismomes = lunes.getMonth() === domingo.getMonth();
    const rango = mismomes
      ? lunes.getDate()+' al '+domingo.getDate()+' de '+MESES_ES[lunes.getMonth()]
      : lunes.getDate()+' de '+MESES_ES[lunes.getMonth()]+' al '+domingo.getDate()+' de '+MESES_ES[domingo.getMonth()];
    return 'Semana del '+rango+' de '+domingo.getFullYear();
  }
  function renderAsistencia(){
    const g = grupoActual();
    const serie = serieDe(g.id);
    const integrantes = integrantesDe(g.id);
    const nav = '<div class="toolbar">'
      + '<button type="button" class="ghost-btn'+(modoAsistencia==='serie'?' active':'')+'" data-modoasist="serie" style="'+(modoAsistencia==='serie'?'border-color:var(--blue); color:var(--blue);':'')+'">Entrenamiento recurrente</button>'
      + '<button type="button" class="ghost-btn'+(modoAsistencia==='puntual'?' active':'')+'" data-modoasist="puntual" style="'+(modoAsistencia==='puntual'?'border-color:var(--blue); color:var(--blue);':'')+'">Actividad puntual</button>'
      + '</div>';
    let cuerpo = '';
    if(modoAsistencia === 'serie'){
      if(!serie){
        cuerpo = '<p class="empty-note">Este grupo no tiene un entrenamiento recurrente agendado. Créelo desde "Actividades".</p>';
      } else if(!integrantes.length){
        cuerpo = '<p class="empty-note">Todavía no hay integrantes aprobados para pasar lista.</p>';
      } else {
        const datos = ASISTENCIA_SEMANA[g.id] || {};
        const columnas = serie.dias.map(function(d){ return {dia:d, fecha:fechaDeDiaEstaSemana(d)}; });
        cuerpo = '<p class="screen-sub" style="margin-bottom:2px; font-weight:600; color:var(--ink);">'+esc(tituloSemanaHTML())+'</p>'
          + '<p class="screen-sub" style="margin-bottom:14px;">Haga clic en una celda para alternar Presente / Ausente / Excusado. Un día que ya pasó no se puede modificar.</p>'
          + '<table class="asistencia-grid"><thead><tr><th>Integrante</th>'
            + columnas.map(function(c){
                return '<th>'+esc(c.dia)+'<br><span style="font-weight:400; font-size:10px; color:var(--ink-soft);">'+c.fecha.getDate()+' '+esc(MESES_ES[c.fecha.getMonth()].slice(0,3))+'</span></th>';
              }).join('')
          + '</tr></thead><tbody>'
          + integrantes.map(function(s){
              return '<tr><td>'+esc(s.nombre)+'</td>' + columnas.map(function(c){
                const est = (datos[s.id] && datos[s.id][c.dia]) || null;
                const simbolo = {presente:'\u2713', ausente:'\u2715', excusado:'!'}[est] || '';
                const pasado = esDiaYaPasado(c.fecha);
                if(pasado){
                  return '<td><button type="button" class="celda-asistencia '+(est||'')+'" disabled title="Este día ya pasó, no se puede modificar">'+simbolo+'</button></td>';
                }
                return '<td><button type="button" class="celda-asistencia '+(est||'')+'" data-asist-id="'+s.id+'" data-asist-dia="'+esc(c.dia)+'">'+simbolo+'</button></td>';
              }).join('') + '</tr>';
            }).join('')
          + '</tbody></table>';
      }
    } else {
      const puntuales = actividadesDe(g.id).filter(a=>a.estado === 'VALIDADA');
      if(!puntuales.length){
        cuerpo = '<p class="empty-note">No hay actividades puntuales validadas todavía para pasar lista.</p>';
      } else {
        cuerpo = puntuales.map(function(a){
          const inscritos = integrantes.filter(s=>a.inscritos.indexOf(s.id) !== -1);
          return '<div class="config-card"><h4>'+esc(a.titulo)+' — '+esc(a.fecha)+'</h4>'
            + (inscritos.length
                ? '<table class="tbl"><thead><tr><th>Integrante</th><th>Asistencia</th></tr></thead><tbody>'
                  + inscritos.map(s=>'<tr><td>'+esc(s.nombre)+'</td><td class="actions" style="margin-top:0;">'
                      + '<button type="button" class="btn-accion approve" data-punt-id="'+s.id+'" data-punt-act="'+a.id+'" data-punt-estado="presente">\u2713 Presente</button>'
                      + '<button type="button" class="btn-accion reject" data-punt-id="'+s.id+'" data-punt-act="'+a.id+'" data-punt-estado="ausente">\u2715 Ausente</button>'
                      + '<button type="button" class="btn-accion observe" data-punt-id="'+s.id+'" data-punt-act="'+a.id+'" data-punt-estado="excusado">\u270E Excusado</button>'
                      + '</td></tr>').join('')
                  + '</tbody></table>'
                : '<p class="empty-note">Nadie se ha inscrito a esta actividad todavía.</p>')
            + '</div>';
        }).join('');
      }
    }
    document.getElementById('screen-asistencia').innerHTML =
      '<h2 class="screen-title">Pasar lista — '+esc(g.nombre)+'</h2>' + nav + cuerpo;
  }
  function alternarCeldaAsistencia(idIntegrante, dia){
    const g = grupoActual();
    if(!ASISTENCIA_SEMANA[g.id]) ASISTENCIA_SEMANA[g.id] = {};
    if(!ASISTENCIA_SEMANA[g.id][idIntegrante]) ASISTENCIA_SEMANA[g.id][idIntegrante] = {};
    const actual = ASISTENCIA_SEMANA[g.id][idIntegrante][dia];
    const siguiente = {undefined:'presente', null:'presente', presente:'ausente', ausente:'excusado', excusado:null}[actual === undefined ? 'undefined' : actual];
    if(siguiente === 'excusado' || (actual === 'ausente' && siguiente === 'excusado')){
      // pedir justificacion antes de confirmar el excusado
      abrirDialogo(
        '<h3>Justificar ausencia</h3><p class="dsub">Una ausencia excusada necesita un motivo. Usted queda registrado(a) como quien la valida.</p>'
        + '<div class="field" id="f-just-wrap"><label for="f-just">Motivo</label><textarea id="f-just" placeholder="Ej. Cita médica, presentó constancia."></textarea><span class="err-msg">Escribe el motivo.</span></div>'
        + '<div class="dialog-actions"><button type="button" class="ghost-btn" data-cerrar>Cancelar</button><button type="button" class="primary-btn" id="btn-confirmar-just">Guardar</button></div>'
      );
      document.getElementById('btn-confirmar-just').addEventListener('click', function(){
        const v = document.getElementById('f-just').value.trim();
        if(!v){ document.getElementById('f-just-wrap').classList.add('error'); return; }
        ASISTENCIA_SEMANA[g.id][idIntegrante][dia] = 'excusado';
        JUSTIFICACIONES[idIntegrante+'-'+dia] = v;
        cerrarDialogo();
        renderAsistencia();
      });
      return;
    }
    ASISTENCIA_SEMANA[g.id][idIntegrante][dia] = siguiente;
    renderAsistencia();
  }

  // ================= CONFIGURACIÓN =================
  function renderConfig(){
    const g = grupoActual();
    const catalogoActividad = TIPOS_ACTIVIDAD[g.tipo] || [];
    let bloqueMedida;
    if(g.tipo === 'deportivo'){
      bloqueMedida = '<div class="config-card"><h4>% mínimo de entrenamientos</h4><p>Solo aplica a grupos deportivos: reemplaza por completo el mínimo de actividades total.</p>'
        + '<input type="number" id="cfg-pct" min="1" max="100" value="'+g.porcentajeMinimoEntrenamientos+'"> %</div>';
    } else {
      bloqueMedida = '<div class="config-card"><h4>Mínimo de actividades</h4><p>Total exigido en el período, y opcionalmente un ritmo mensual.</p>'
        + '<label style="display:block; margin-bottom:10px;">Mínimo total: <input type="number" id="cfg-min" min="1" value="'+g.minimoActividades+'"></label>'
        + '<label>Mínimo por mes (opcional): <input type="number" id="cfg-min-mes" min="1" value="'+(g.minimoActividadesPorMes||'')+'"></label></div>';
    }
    const tiposCheck = '<div class="config-card"><h4>Tipos de actividad habilitados</h4><p>Solo los marcados aquí se pueden usar al registrar una actividad de este grupo.</p>'
      + '<div class="checkbox-grid">' + catalogoActividad.map(function(t){
          const on = (g.tiposHabilitados||[]).indexOf(t) !== -1;
          return '<label class="checkbox-row"><input type="checkbox" data-tipo-check="'+esc(t)+'" '+(on?'checked':'')+'> '+esc(t)+'</label>';
        }).join('') + '</div></div>';
    let disciplinas = '';
    if(g.tipo === 'artistico'){
      disciplinas = '<div class="config-card"><h4>Disciplinas del grupo</h4><p>Un grupo normalmente tiene una sola, pero puede tener varias a la vez (ej. una asociación con más de un área).</p>'
        + '<div class="badge-row">' + (g.disciplinas||[]).map(d=>'<span class="badge-tag artistico" style="margin-right:6px;">'+esc(d)+'</span>').join('') + '</div></div>';
    }
    document.getElementById('screen-config').innerHTML =
      '<h2 class="screen-title">Configuración — '+esc(g.nombre)+'</h2>'
      + '<p class="screen-sub">Ajustes que determinan cómo se mide la elegibilidad y qué se puede registrar en este grupo.</p>'
      + bloqueMedida + disciplinas + tiposCheck
      + '<button type="button" class="primary-btn" id="btn-guardar-config">Guardar cambios</button>';
  }
  function guardarConfig(){
    const g = grupoActual();
    if(g.tipo === 'deportivo'){
      g.porcentajeMinimoEntrenamientos = Number(document.getElementById('cfg-pct').value) || g.porcentajeMinimoEntrenamientos;
    } else {
      g.minimoActividades = Number(document.getElementById('cfg-min').value) || g.minimoActividades;
      const mes = document.getElementById('cfg-min-mes').value;
      g.minimoActividadesPorMes = mes ? Number(mes) : null;
    }
    const marcados = Array.prototype.slice.call(document.querySelectorAll('[data-tipo-check]:checked')).map(el=>el.dataset.tipoCheck);
    g.tiposHabilitados = marcados;
    toast('Configuración guardada.');
    renderConfig();
  }

  // ================= ELEGIBILIDAD =================
  function renderElegibilidad(){
    const g = grupoActual();
    const integrantes = integrantesDe(g.id);
    let filas;
    if(g.tipo === 'deportivo'){
      filas = integrantes.map(function(s){
        const pct = s.id % 2 === 0 ? 55 : 82; // dato de muestra, sin backend real
        const ok = pct >= g.porcentajeMinimoEntrenamientos;
        return '<tr><td>'+esc(s.nombre)+'</td><td style="width:200px;"><div class="bar-track"><div class="bar-fill '+(ok?'ok':'no')+'" style="width:'+pct+'%;"></div></div></td>'
          + '<td>'+pct+'% (mínimo '+g.porcentajeMinimoEntrenamientos+'%)</td>'
          + '<td><span class="pill '+(ok?'validada':'no_cumple')+'">'+(ok?'Elegible':'No elegible')+'</span></td></tr>';
      }).join('');
    } else {
      filas = integrantes.map(function(s){
        const n = s.id % 2 === 0 ? 4 : 7;
        const ok = n >= g.minimoActividades;
        return '<tr><td>'+esc(s.nombre)+'</td><td>'+n+' de '+g.minimoActividades+' actividades</td><td colspan="1"></td>'
          + '<td><span class="pill '+(ok?'validada':'no_cumple')+'">'+(ok?'Elegible':'No elegible')+'</span></td></tr>';
      }).join('');
    }
    document.getElementById('screen-elegibilidad').innerHTML =
      '<h2 class="screen-title">Elegibilidad — '+esc(g.nombre)+'</h2>'
      + '<p class="screen-sub">Cálculo de referencia para este período. Los números son de muestra para esta maqueta.</p>'
      + (filas ? '<div class="tbl-wrap"><table class="tbl"><thead><tr><th>Integrante</th><th></th><th>Detalle</th><th>Estado</th></tr></thead><tbody>'+filas+'</tbody></table></div>' : '<p class="empty-note">Sin integrantes todavía.</p>')
      + '<button type="button" class="primary-btn" id="btn-generar-lista" style="margin-top:16px;">Generar lista de elegibles</button>';
  }

  // ================= SELECCIÓN (solo grupos esSeleccion) =================
  function renderSeleccion(){
    const g = grupoActual();
    const convocados = SELECCION_CONVOCADOS[g.id] || [];
    document.getElementById('screen-seleccion').innerHTML =
      '<h2 class="screen-title">Convocados — '+esc(g.nombre)+'</h2>'
      + '<p class="screen-sub">Solo puede convocar a integrantes que ya estén en el equipo de su grupo de origen, sin importar el campus.</p>'
      + (convocados.length ? '<div class="tbl-wrap"><table class="tbl"><thead><tr><th>Nombre</th><th>Grupo de origen</th><th>Campus</th></tr></thead><tbody>'
          + convocados.map(c=>'<tr><td>'+esc(c.nombre)+'</td><td>'+esc(c.grupoOrigen)+'</td><td>'+esc(c.campus||'—')+'</td></tr>').join('') + '</tbody></table></div>'
        : '<p class="empty-note">Todavía no hay convocados.</p>')
      + '<button type="button" class="primary-btn" id="btn-convocar" style="margin-top:16px;">+ Convocar integrante</button>';
  }
  let filtroCampusConvocar = 'todos';
  function candidatosDisponiblesConvocar(){
    const g = grupoActual();
    let disponibles = EQUIPO_DISPONIBLE_PARA_SELECCION.filter(function(c){
      const yaEsta = (SELECCION_CONVOCADOS[g.id]||[]).some(x=>x.idSolicitudOrigen === c.idSolicitudOrigen);
      return c.esEquipo && !yaEsta;
    });
    if(filtroCampusConvocar !== 'todos') disponibles = disponibles.filter(c=>c.campus === filtroCampusConvocar);
    return disponibles;
  }
  function renderOpcionesConvocar(){
    const sel = document.getElementById('f-convocar');
    if(!sel) return;
    const disponibles = candidatosDisponiblesConvocar();
    sel.innerHTML = disponibles.length
      ? disponibles.map(c=>'<option value="'+c.idSolicitudOrigen+'">'+esc(c.nombre)+' — '+esc(c.grupoOrigen)+' ('+esc(c.campus)+')</option>').join('')
      : '<option disabled>Nadie disponible con este filtro</option>';
  }
  function dialogoConvocar(){
    filtroCampusConvocar = 'todos';
    const todos = EQUIPO_DISPONIBLE_PARA_SELECCION.filter(function(c){
      const g = grupoActual();
      const yaEsta = (SELECCION_CONVOCADOS[g.id]||[]).some(x=>x.idSolicitudOrigen === c.idSolicitudOrigen);
      return c.esEquipo && !yaEsta;
    });
    if(!todos.length){ toast('No hay integrantes del equipo disponibles para convocar, en ningún campus.'); return; }
    const campusDisponibles = Array.from(new Set(todos.map(c=>c.campus)));
    abrirDialogo(
      '<h3>Convocar a la selección</h3><p class="dsub">Solo aparecen quienes ya están en el equipo de su propio grupo (esEquipo = verdadero), de cualquier campus.</p>'
      + '<div class="field"><label for="f-campus-convocar">Filtrar por campus</label><select id="f-campus-convocar">'
        + '<option value="todos">Todos los campus</option>'
        + campusDisponibles.map(c=>'<option value="'+esc(c)+'">'+esc(c)+'</option>').join('')
      + '</select></div>'
      + '<div class="field"><label for="f-convocar">Integrante</label><select id="f-convocar"></select></div>'
      + '<div class="dialog-actions"><button type="button" class="ghost-btn" data-cerrar>Cancelar</button><button type="button" class="primary-btn" id="btn-confirmar-convocar">Convocar</button></div>',
      function(){
        renderOpcionesConvocar();
        document.getElementById('f-campus-convocar').addEventListener('change', function(){
          filtroCampusConvocar = this.value;
          renderOpcionesConvocar();
        });
      }
    );
    document.getElementById('btn-confirmar-convocar').addEventListener('click', function(){
      const sel = document.getElementById('f-convocar');
      if(!sel.value){ toast('No hay nadie seleccionado.'); return; }
      const id = Number(sel.value);
      const c = EQUIPO_DISPONIBLE_PARA_SELECCION.find(x=>x.idSolicitudOrigen === id);
      const g = grupoActual();
      if(!SELECCION_CONVOCADOS[g.id]) SELECCION_CONVOCADOS[g.id] = [];
      SELECCION_CONVOCADOS[g.id].push(c);
      cerrarDialogo();
      toast(c.nombre+' convocado(a) a '+g.nombre+'.');
      renderSeleccion();
    });
  }

  // ================= WIRING =================
  function renderPantallaActual(){
    if(screen === 'solicitudes') renderSolicitudes();
    else if(screen === 'ficha') renderFicha(fichaActualId);
    else if(screen === 'integrantes') renderIntegrantes();
    else if(screen === 'actividades') renderActividades();
    else if(screen === 'asistencia') renderAsistencia();
    else if(screen === 'config') renderConfig();
    else if(screen === 'elegibilidad') renderElegibilidad();
    else if(screen === 'seleccion') renderSeleccion();
  }

  document.getElementById('grupo-select').addEventListener('change', function(){
    grupoActualId = Number(this.value);
    renderGrupoSelect();
    const items = navItems().map(i=>i.id);
    if(items.indexOf(pantallaVisible(screen)) === -1) screen = items[0];
    showScreen(screen);
    renderPantallaActual();
  });

  document.getElementById('app-nav').addEventListener('click', function(e){
    const b = e.target.closest('[data-nav]');
    if(!b) return;
    showScreen(b.dataset.nav);
    renderPantallaActual();
  });

  document.getElementById('screen-solicitudes').addEventListener('click', function(e){
    const modo = e.target.closest('[data-modo]');
    if(modo){ modoRevision = modo.dataset.modo; indiceCarrusel = 0; animCarrusel = null; renderSolicitudes(); return; }
    const pinBtn = e.target.closest('[data-pin]');
    if(pinBtn){
      const key = pinBtn.dataset.pin;
      if(pinnedCols.has(key)) pinnedCols.delete(key); else pinnedCols.add(key);
      renderSolicitudes();
      return;
    }
    if(e.target.closest('#btn-carrusel-prev')){ animCarrusel = 'prev'; indiceCarrusel--; renderSolicitudes(); return; }
    if(e.target.closest('#btn-carrusel-next')){ animCarrusel = 'next'; indiceCarrusel++; renderSolicitudes(); return; }
    const slot = e.target.closest('[data-slot]');
    if(slot){
      const destino = Number(slot.dataset.slot);
      if(Number.isInteger(destino)){
        animCarrusel = slot.classList.contains('prev') ? 'prev' : 'next';
        indiceCarrusel = destino;
        renderSolicitudes();
      }
      return;
    }
    const fila = e.target.closest('[data-row]');
    const btnAccion = e.target.closest('[data-accion]');
    if(btnAccion && btnAccion.dataset.accion === 'verficha'){ fichaActualId = Number(btnAccion.dataset.id); renderFicha(fichaActualId); showScreen('ficha'); return; }
    if(btnAccion){ accionSolicitud(btnAccion.dataset.accion, Number(btnAccion.dataset.id)); return; }
    if(fila){ fichaActualId = Number(fila.dataset.id); renderFicha(fichaActualId); showScreen('ficha'); return; }
  });
  document.getElementById('screen-solicitudes').addEventListener('change', function(e){
    if(e.target.id === 'sol-filtro'){ filtroEstado = e.target.value; renderSolicitudes(); }
    if(e.target.id === 'sol-filtro-posicion'){ filtroPosicion = e.target.value; renderSolicitudes(); }
  });
  document.getElementById('screen-ficha').addEventListener('click', function(e){
    if(e.target.closest('#btn-back-solicitudes')){ showScreen('solicitudes'); renderSolicitudes(); return; }
    const btnAccion = e.target.closest('[data-accion]');
    if(btnAccion) accionSolicitud(btnAccion.dataset.accion, Number(btnAccion.dataset.id));
  });
  document.getElementById('screen-integrantes').addEventListener('click', function(e){
    const btnAccion = e.target.closest('[data-accion]');
    if(btnAccion){
      const id = Number(btnAccion.dataset.id);
      if(btnAccion.dataset.accion === 'verficha'){ fichaActualId = id; renderFicha(id); showScreen('ficha'); }
      else if(btnAccion.dataset.accion === 'expulsar'){ solicitarExpulsion(id); }
      return;
    }
  });
  document.getElementById('screen-integrantes').addEventListener('change', function(e){
    const chk = e.target.closest('[data-equipo]');
    if(!chk) return;
    const s = SOLICITUDES.find(x=>x.id === Number(chk.dataset.equipo));
    if(s){ s.esEquipo = chk.checked; toast((chk.checked?'Agregado(a) al':'Quitado(a) del')+' equipo.'); }
  });
  document.getElementById('screen-actividades').addEventListener('click', function(e){
    if(e.target.closest('#btn-nueva-actividad')){ dialogoNuevaActividad(); return; }
    if(e.target.closest('#btn-nueva-serie')){ dialogoNuevaSerie(); return; }
  });
  document.getElementById('screen-asistencia').addEventListener('click', function(e){
    const modo = e.target.closest('[data-modoasist]');
    if(modo){ modoAsistencia = modo.dataset.modoasist; renderAsistencia(); return; }
    const celda = e.target.closest('[data-asist-id]');
    if(celda){ alternarCeldaAsistencia(Number(celda.dataset.asistId), celda.dataset.asistDia); return; }
    const punt = e.target.closest('[data-punt-id]');
    if(punt){ toast('Asistencia registrada.'); return; }
  });
  document.getElementById('screen-config').addEventListener('click', function(e){
    if(e.target.closest('#btn-guardar-config')) guardarConfig();
  });
  document.getElementById('screen-elegibilidad').addEventListener('click', function(e){
    if(e.target.closest('#btn-generar-lista')) toast('Lista de elegibles generada — lista para descargar en Reportes del administrador.');
  });
  document.getElementById('screen-seleccion').addEventListener('click', function(e){
    if(e.target.closest('#btn-convocar')) dialogoConvocar();
  });
  document.getElementById('dialog-overlay').addEventListener('click', function(e){
    if(e.target.closest('[data-cerrar]') || e.target === this) cerrarDialogo();
  });
  document.addEventListener('keydown', function(e){
    if(e.key === 'Escape') cerrarDialogo();
  });

  renderGrupoSelect();
